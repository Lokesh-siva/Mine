name: Build Mine APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk Mine.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Mine-apk
          path: Mine/Mine.apk

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Mine.apk --title "Mine – latest build" --notes "Built from commit ${GITHUB_SHA::7}"
