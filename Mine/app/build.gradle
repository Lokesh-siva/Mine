plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mine.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mine.app'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // Fixed signing key so new versions install over the old one and keep your data
    signingConfigs {
        mine {
            storeFile file('mine.keystore')
            storePassword 'minekey123'
            keyAlias 'mine'
            keyPassword 'minekey123'
            storeType 'pkcs12'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.mine
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.mine
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
