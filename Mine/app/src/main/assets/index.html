function watchSettings(){try{return JSON.parse(window.MineNative.watchSettings())}catch(e){return {sms:false,smsPerm:false,weekly:true,monthly:true,lastScan:0}}}
function smsCands(){if(!NATIVE)return [];try{return JSON.parse(window.MineNative.smsCandidates())||[]}catch(e){return []}}
// Ignored bank SMS in the review period, minus any added as an expense afterwards
function smsIgnored(){if(!NATIVE)return [];const from=smsFrom(),linked=new Set(S.txns.map(t=>t.smsId).filter(Boolean));try{return (JSON.parse(window.MineNative.smsIgnored())||[]).filter(o=>o.date>=from&&!linked.has(o.id)).sort((a,b)=>b.ts-a.ts)}catch(e){return []}}
// First day the SMS review covers: the date picked in the review sheet, or the last 7 days
function smsFrom(w){w=w||watchSettings();return w.since?ymd(new Date(w.since)):ymd(addDays(new Date(),-6))}
const dayNum=s=>Math.round(parseYmd(s).getTime()/864e5);
const merchKey=m=>String(m||'').toLowerCase().replace(/[^a-z0-9@]/g,'');
const acctByLast4=l=>l?S.accounts.find(a=>a.last4&&String(a.last4)===String(l)):null;
// Same rule as the 9 pm check: an SMS is covered by an expense of the same amount within a day either side
function smsUnmatched(){
  const ex=S.txns.filter(t=>t.type==='expense'), linked=new Set(), used=new Set();
  ex.forEach(t=>{if(t.smsId){linked.add(t.smsId);used.add(t.id)}});
  const from=smsFrom();
  return smsCands().sort((a,b)=>a.ts-b.ts).filter(o=>{
    if(linked.has(o.id)||o.date<from) return false;
    const e=ex.find(t=>!used.has(t.id)&&Math.abs(+t.amount-o.amt)<1&&Math.abs(dayNum(t.date)-dayNum(o.date))<=1);
    if(e){used.add(e.id);return false} return true;
  }).sort((a,b)=>b.ts-a.ts);
}
function smsBanner(){
  if(!NATIVE) return '';
  const u=smsUnmatched(); if(!u.length) return '';
  return `<button class="banner" data-act="sms-review">${I.money}<div class="grow"><b>${u.length} expense${u.length>1?'s':''} not added</b><div class="small">${inr(u.reduce((a,o)=>a+o.amt,0))} from your bank SMS</div></div><span class="go">Review</span></button>`;
}
function smsReviewSheet(){
  const w=watchSettings(), u=smsUnmatched(), from=smsFrom(w), since=w.since?fmtDay(from):'the last 7 days';
  const pick=`<div class="row" style="align-items:flex-end;gap:8px;margin-bottom:12px"><div class="grow"><label class="f" for="sms-from" style="margin-top:0">Check bank SMS from</label><input class="in" type="date" id="sms-from" value="${from}" min="${ymd(addDays(new Date(),-365))}" max="${todayS()}"></div>${w.since?`<button class="btn sm ghost" data-act="sms-from-reset">Last 7 days</button>`:''}</div>`;
  const auto=[],todo=[],ign=w.sms?smsIgnored():[]; u.forEach(o=>{const c=autoCat(o);if(c)auto.push([o,c]);else todo.push(o)});
  const tab=UI.smsTab==='ignored'&&ign.length?'ignored':UI.smsTab==='auto'&&auto.length?'auto':UI.smsTab==='review'||!auto.length||todo.length?'review':'auto';
  const head=(o,cat,acc,note)=>`<div class="row"><div class="txicon">${esc(CAT_ICON[cat]||'💬')}</div><div class="grow" style="min-width:0"><div style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(note||o.merchant||o.sender||'Bank debit')}</div><div class="tiny muted">${fmtDay(o.date)} · ${esc(acc?acc.name:o.last4?'XX'+o.last4:o.sender||'')}</div></div><div class="txamt num neg">${inr(o.amt)}</div></div>${smsMsgBox(o.id)}`;
  let body;
  if(!w.sms) body=`<p class="muted">Mine can read your bank SMS every day at 9 pm and tell you about spending you haven’t added. Messages never leave your phone, and OTPs are skipped.</p><button class="btn primary" data-act="sms-on">Turn on SMS check</button>`;
  else if(!u.length&&!ign.length) body=pick+`<div class="empty">All caught up. Every bank debit ${w.since?'since '+since:'from '+since} is in your expenses.</div>`;
  else {
    body=pick+`<div class="row" style="margin-bottom:12px"><div class="seg grow" role="group" aria-label="List"><button style="flex:1" data-act="sms-tab" data-v="review" aria-pressed="${tab==='review'}">To review (${todo.length})</button><button style="flex:1" data-act="sms-tab" data-v="auto" aria-pressed="${tab==='auto'}">Auto (${auto.length})</button><button style="flex:1" data-act="sms-tab" data-v="ignored" aria-pressed="${tab==='ignored'}">Ignored (${ign.length})</button></div></div>`;
    if(tab==='ignored') body+=`<p class="small muted" style="margin-top:0">Bank messages you ignored. Restore one to review it again.</p>`+ign.map(o=>`<div class="smsrow">${head(o,null,acctByLast4(o.last4))}
    <div class="row" style="justify-content:flex-end;gap:8px;margin-top:8px"><button class="btn sm" data-act="sms-unignore" data-id="${esc(o.id)}">Restore</button><button class="btn sm primary" data-act="sms-add" data-id="${esc(o.id)}">${I.plus} Add</button></div></div>`).join('');
    else if(tab==='review') body+=todo.length?`<p class="small muted" style="margin-top:0">Bank debits with no matching expense and no rule. Add them, ignore ones that aren’t spending, or make a rule so similar ones are categorized for you.</p>`+todo.map(o=>`<div class="smsrow">${head(o,null,acctByLast4(o.last4))}
    <div class="row" style="justify-content:flex-end;gap:8px;margin-top:8px"><button class="btn sm ghost" style="margin-right:auto" data-act="rule-from" data-id="${esc(o.id)}">+ Rule</button><button class="btn sm" data-act="sms-ignore" data-id="${esc(o.id)}">Ignore</button><button class="btn sm primary" data-act="sms-add" data-id="${esc(o.id)}">${I.plus} Add</button></div></div>`).join(''):`<div class="empty">Nothing left to review by hand. Check the auto-categorized list.</div>`;
    else body+=`<div class="row" style="margin-bottom:6px"><p class="small muted grow" style="margin:0">Categorized by your rules or earlier expenses. Edit anything that’s wrong, then approve.</p><button class="btn sm primary" data-act="sms-approve-all">Approve all</button></div>`+auto.map(([o,c])=>{const acc=c.acc?acctById(c.acc):acctByLast4(o.last4);return `<div class="smsrow">${head(o,c.cat,acc,c.note)}
    <div class="row" style="gap:6px;margin-top:6px;flex-wrap:wrap"><span class="chip" style="pointer-events:none">${esc(CAT_ICON[c.cat]||'')} ${esc(c.cat)}</span><span class="tiny muted">${c.rule?'Rule: '+esc(ruleLabel(c.rule)):'Learned from earlier expenses'}</span></div>
    <div class="row" style="justify-content:flex-end;gap:8px;margin-top:8px"><button class="btn sm" data-act="sms-ignore" data-id="${esc(o.id)}">Ignore</button><button class="btn sm" data-act="sms-add" data-id="${esc(o.id)}">Edit</button><button class="btn sm primary" data-act="sms-approve" data-id="${esc(o.id)}">${I.check} Approve</button></div></div>`}).join('');
  }
  openModal(sheetHead('Expenses to review')+body+`<div class="sheet-foot">${w.sms?`<button class="btn left" data-act="sms-check">Check messages now</button>`:''}${w.sms?`<button class="btn" data-act="rules-open" data-v="sms">Rules</button>`:''}<button class="btn" data-act="close-modal">Close</button></div>`,{type:'sms'});
}
// Full bank SMS, read from the inbox when the "Show message" section is opened
function smsMsg(id){try{const j=window.MineNative.smsMessage(id);return j?JSON.parse(j):null}catch(e){return null}}
const smsMsgBox=id=>NATIVE&&id?`<details class="smsmsg" data-sms="${esc(id)}"><summary>Show message</summary><div class="smsbody tiny muted">Loading…</div></details>`:'';
function smsMsgFill(el){
  const m=smsMsg(el.dataset.sms),b=el.querySelector('.smsbody');
  if(!m){b.textContent='This message is no longer in your SMS inbox.';return}
  const d=new Date(m.ts),when=d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'})+' · '+fmtTime(pad(d.getHours())+':'+pad(d.getMinutes()));
  b.classList.remove('tiny','muted');
  b.innerHTML=`<div class="row" style="gap:8px"><div class="tiny muted grow">${esc(m.addr||'')} · ${when}</div><button class="btn sm ghost" data-act="sms-open" data-v="${esc(m.addr||'')}">Open in Messages</button></div><p>${esc(m.body||'')}</p>`;
}
document.addEventListener('toggle',e=>{const el=e.target;if(el.classList&&el.classList.contains('smsmsg')&&el.open&&!el.dataset.done){el.dataset.done=1;smsMsgFill(el)}},true);
// Expenses added from SMS before times were kept: take the time the SMS arrived
function smsTimeBackfill(){
  if(!NATIVE) return; const ms=new Set();
  S.txns.forEach(t=>{if(t.smsId&&!t.time){const m=smsMsg(t.smsId);if(m&&m.ts){t.time=hhmm(new Date(m.ts));ms.add('txn_'+t.date.slice(0,7))}}});
  if(ms.size) Store.mark(...ms);
}
function smsSetFrom(ms){
  let n=0;try{n=window.MineNative.smsSince(ms)}catch(err){}
  toast(n?n+' bank message'+(n>1?'s':'')+' found':'No new bank messages');render();smsReviewSheet();
}
function smsAdd(id){
  const o=smsCands().concat(smsIgnored()).find(x=>x.id===id); if(!o) return;
  const a=acctByLast4(o.last4), k=merchKey(o.merchant), c=autoCat(o)||{};
  openTx(null,'expense',{amount:o.amt,date:o.date,time:o.ts?hhmm(new Date(o.ts)):'',note:c.note||o.merchant||'',acc:c.acc||(a?a.id:''),cat:c.cat||null,smsId:o.id},{mkey:k,fromSms:true});
}
// Adds an auto-categorized SMS debit as an expense without opening the editor
function smsApprove(id,quiet){
  const o=smsCands().find(x=>x.id===id), c=o&&autoCat(o); if(!c) return 0;
  const a=acctByLast4(o.last4);
  S.txns.push({id:uid(),type:'expense',amount:r2(o.amt),acc:c.acc||(a?a.id:''),cat:c.cat,note:c.note||o.merchant||'',date:o.date,...(o.ts?{time:hhmm(new Date(o.ts))}:{}),created:Date.now(),smsId:o.id});
  Store.mark('money','txn_'+o.date.slice(0,7));
  if(!quiet){render();smsReviewSheet();toast('Added '+inr(o.amt)+' to '+c.cat)}
  return o.amt;
}

/* ----- expense rules: categorize bank debits automatically ----- */
const ruleTerms=s=>String(s||'').toLowerCase().split(',').map(x=>x.trim()).filter(Boolean);
const ruleLabel=r=>r.name||[ruleTerms(r.text).join(' / '),ruleTerms(r.pay).join(' / ')].filter(Boolean).join(' · ')||r.cat;
// Every condition that is filled in must match; a rule needs at least one condition
function ruleHits(r,o){
  if(r.off||!S.cats.exp.includes(r.cat)) return false;
  const desc=String(o.merchant||o.note||'').toLowerCase(), t=ruleTerms(r.text), p=ruleTerms(r.pay), a=o.acc?acctById(o.acc):acctByLast4(o.last4);
  const pay=[o.sender,o.last4,a&&a.name].filter(Boolean).join(' ').toLowerCase();
  if(!t.length&&!p.length&&!r.acc&&!r.min&&!r.max) return false;
  if(t.length&&!t.some(x=>r.how==='starts'?desc.startsWith(x):r.how==='exact'?desc===x:desc.includes(x))) return false;
  if(p.length&&!p.some(x=>pay.includes(x))) return false;
  if(r.acc&&(!a||a.id!==r.acc)) return false;
  if(r.min&&o.amt<+r.min) return false;
  if(r.max&&o.amt>+r.max) return false;
  return true;
}
function autoCat(o){
  const r=(S.rules||[]).find(x=>ruleHits(x,o));
  if(r) return {cat:r.cat,note:r.note||'',acc:r.setAcc||'',rule:r};
  const k=merchKey(o.merchant), c=k&&S.mcat[k];
  return c&&S.cats.exp.includes(c)?{cat:c}:null;
}
function rulesSheet(back){
  const rs=S.rules||[];
  openModal(sheetHead('Expense rules')+`<p class="small muted" style="margin-top:0">Rules categorize bank debits for you. The first rule that matches wins, so put specific rules above general ones.</p>
  ${rs.map((r,i)=>`<div class="txrow" style="padding:10px 4px"><div class="txicon">${esc(CAT_ICON[r.cat]||'🏷️')}</div><div class="grow" data-act="rule-edit" data-id="${r.id}" style="min-width:0;cursor:pointer"><b style="${r.off?'opacity:.5':''}">${esc(ruleLabel(r))}</b><div class="tiny muted">${esc(r.cat)}${r.note?' · rename to “'+esc(r.note)+'”':''}${r.off?' · off':''}</div></div>${i?`<button class="icon-btn" data-act="rule-up" data-id="${r.id}" aria-label="Move up">↑</button>`:''}</div>`).join('')||'<div class="empty">No rules yet. Example: description contains “swiggy, zomato” → Food & dining.</div>'}
  <div class="sheet-foot">${back==='sms'?`<button class="btn left" data-act="sms-review">Back</button>`:''}<button class="btn primary" data-act="rule-new" data-v="${back||''}">${I.plus} Add rule</button><button class="btn" data-act="close-modal">Close</button></div>`,{type:'rules',back});
}
function ruleEditor(r,back){
  const accOpts=sel=>`<option value="">Any</option>`+S.accounts.map(a=>`<option value="${a.id}" ${sel===a.id?'selected':''}>${esc(a.name)}</option>`).join('');

  openModal(sheetHead(r._new?'New rule':'Edit rule')+`
  <h3 style="margin:4px 0 0">When</h3>
  <label class="f" for="r-text">Description</label><div class="frow" style="grid-template-columns:130px 1fr"><select class="in" id="r-how">${[['contains','contains'],['starts','starts with'],['exact','is exactly']].map(([k,l])=>`<option value="${k}" ${(r.how||'contains')===k?'selected':''}>${l}</option>`).join('')}</select><input class="in" id="r-text" value="${esc(r.text||'')}" placeholder="swiggy, zomato" autofocus></div>
  <label class="f" for="r-pay">Payment contains (bank, card digits or payment method)</label><input class="in" id="r-pay" value="${esc(r.pay||'')}" placeholder="HDFC, 1234">
  <div class="frow"><div><label class="f" for="r-acc">Paid with</label><select class="in" id="r-acc">${accOpts(r.acc)}</select></div><div><label class="f">Amount (₹)</label><div class="row" style="gap:6px"><input class="in num" id="r-min" type="number" min="0" value="${r.min||''}" placeholder="Min"><input class="in num" id="r-max" type="number" min="0" value="${r.max||''}" placeholder="Max"></div></div></div>
  <p class="tiny muted" style="margin:6px 0 0">Separate words with commas to match any of them. Leave a field empty to ignore it.</p>
  <h3 style="margin:18px 0 0">Then</h3>
  <label class="f">Category</label><div class="catpick" id="r-cat">${S.cats.exp.map(c=>`<button type="button" data-act="tog1" data-v="${esc(c)}" aria-pressed="${r.cat===c}">${esc(CAT_ICON[c]||'')} ${esc(c)}</button>`).join('')}</div>
  <div class="frow"><div><label class="f" for="r-note">Rename to (optional)</label><input class="in" id="r-note" value="${esc(r.note||'')}" placeholder="Swiggy"></div><div><label class="f" for="r-setacc">Set paid with (optional)</label><select class="in" id="r-setacc">${accOpts(r.setAcc).replace('>Any<','>Keep from SMS<')}</select></div></div>
  <label class="f" for="r-name">Rule name (optional)</label><input class="in" id="r-name" value="${esc(r.name||'')}" placeholder="Food delivery">
  ${!r._new?`<label class="check" style="margin-top:12px"><input type="checkbox" id="r-off" ${r.off?'':'checked'}> Rule is on</label>`:''}
  ${n?`<div class="preview">Matches ${n} expense${n>1?'s':''} waiting for review</div>`:''}
  <div class="sheet-foot">${!r._new?`<button class="btn danger left" data-act="rule-del" data-id="${r.id}">${I.trash} Delete</button>`:''}<button class="btn" data-act="rules-open" data-v="${back||''}">Back</button><button class="btn primary" data-act="rule-save">Save</button></div>`,{type:'rule',rule:r,back});
}
function saveRule(){
  const c=modalCtx,r=c.rule,v=id=>$('#'+id).value.trim(),cat=$('#r-cat [aria-pressed="true"]');
  Object.assign(r,{how:v('r-how'),text:v('r-text'),pay:v('r-pay'),acc:v('r-acc'),min:+v('r-min')||0,max:+v('r-max')||0,note:v('r-note'),setAcc:v('r-setacc'),name:v('r-name')});
  if($('#r-off')) r.off=!$('#r-off').checked;
  if(!cat) return toast('Pick a category');
  r.cat=cat.dataset.v;
  if(!r.text&&!r.pay&&!r.acc&&!r.min&&!r.max){$('#r-text').focus();return toast('Add at least one condition')}
  S.rules=S.rules||[];
  if(r._new){delete r._new;S.rules.push(r)} else S.rules[S.rules.findIndex(x=>x.id===r.id)]=r;
  Store.mark('money');
  const n=smsUnmatched().filter(o=>ruleHits(r,o)).length;
  toast('Rule saved'+(n?' · '+n+' expense'+(n>1?'s':'')+' auto-categorized':''));
  if(c.back==='sms'){UI.smsTab=n?'auto':UI.smsTab;smsReviewSheet()} else rulesSheet(c.back);
}
window.mineSmsPerm=ok=>{

/* ----- weekly / monthly review (full screen) ----- */
const RV={kind:'week',start:null};
function rvRange(){
  const b=RV.start||new Date();
  let s,e;
  if(RV.kind==='week'){s=startOfWeek(b);e=addDays(s,6)}else{s=new Date(b.getFullYear(),b.getMonth(),1);e=new Date(b.getFullYear(),b.getMonth()+1,0)}
  const ps=RV.kind==='week'?addDays(s,-7):new Date(s.getFullYear(),s.getMonth()-1,1), pe=RV.kind==='week'?addDays(e,-7):new Date(s.getFullYear(),s.getMonth(),0);
  return {s:ymd(s),e:ymd(e),ps:ymd(ps),pe:ymd(pe),sd:s,ed:e};
}
function renderReview(){
  const el=$('#review'), r=rvRange(), wk=RV.kind==='week', n=todayS();
  const inR=(a,b)=>S.txns.filter(t=>t.type==='expense'&&t.date>=a&&t.date<=b);
  const tx=inR(r.s,r.e), sum=a=>r2(a.reduce((x,t)=>x+ +t.amount,0)), total=sum(tx), prev=sum(inR(r.ps,r.pe)), diff=r2(total-prev);
  const days=n<r.s?0:n>r.e?dayNum(r.e)-dayNum(r.s)+1:dayNum(n)-dayNum(r.s)+1;
  const group=fn=>{const m={};tx.forEach(t=>{const k=fn(t);m[k]=(m[k]||0)+ +t.amount});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
  const bars=(rows,icon)=>rows.length?rows.map(([k,v])=>`<div class="catrow"><span>${icon(k)} ${esc(k)}</span><div class="bar"><i style="width:${v/rows[0][1]*100}%"></i></div><span class="num" style="font-weight:600">${inr(v)} <span class="tiny muted">${total?Math.round(v/total*100):0}%</span></span></div>`).join(''):'<div class="empty">Nothing spent.</div>';
  const byDay=group(t=>t.date), big=tx.slice().sort((a,b)=>b.amount-a.amount).slice(0,5);
  const fmtR=wk?`${r.sd.getDate()} ${MON[r.sd.getMonth()]} – ${r.ed.getDate()} ${MON[r.ed.getMonth()]}`:`${MONL[r.sd.getMonth()]} ${r.sd.getFullYear()}`;
  const unm=NATIVE?smsUnmatched():[];
  const owe=splitTotal(), ppl=Object.keys(splitOwedBy()).length;
  // categories with the change from the previous period
  const catCmp=()=>{const rows=group(t=>t.cat||'Other'),pm={};inR(r.ps,r.pe).forEach(t=>{const k=t.cat||'Other';pm[k]=(pm[k]||0)+ +t.amount});
    return rows.length?rows.map(([k,v],i)=>{const d=r2(v-(pm[k]||0));return `<div class="catrow"><span>${esc(CAT_ICON[k]||'•')} ${esc(k)}</span><div class="bar"><i style="width:${v/rows[0][1]*100}%;background:${CHART_COLS[Math.min(i,7)]}"></i></div><span class="num" style="font-weight:600;text-align:right">${inr(v)}<div class="tiny ${d>0?'neg':'pos'}" style="font-weight:500">${!pm[k]?'new':d>0?'▲ '+inr(d):d<0?'▼ '+inr(-d):'same'}</div></span></div>`}).join(''):'<div class="empty">Nothing spent.</div>'};
  el.innerHTML=`<div class="wrap">
    <div class="top"><button class="icon-btn" data-act="review-close" aria-label="Close">${I.x}</button><div class="grow"></div>
      <div class="seg">${[['week','Week'],['month','Month']].map(([k,l])=>`<button data-act="review-kind" data-v="${k}" aria-pressed="${RV.kind===k}">${l}</button>`).join('')}</div></div>
    <div class="hero"><div class="eyebrow">${wk?'Weekly':'Monthly'} expense review</div>
      <div class="row" style="justify-content:center;gap:4px;margin-top:4px"><button class="icon-btn" data-act="review-nav" data-v="-1" aria-label="Previous">${I.left}</button><div class="range">${fmtR}</div><button class="icon-btn" data-act="review-nav" data-v="1" aria-label="Next" ${r.e>=n?'disabled style="opacity:.3"':''}>${I.right}</button></div>
      <div class="total num">${inr(total)}</div>
      ${prev||total?`<span class="delta ${diff>0?'up':''}">${diff>0?'▲':diff<0?'▼':'='} ${inr(Math.abs(diff))} ${diff>0?'more':diff<0?'less':'same'} than last ${wk?'week':'month'}</span>`:''}
    </div>
    ${unm.length?`<button class="banner" data-act="sms-review">${I.money}<div class="grow"><b>${unm.length} expense${unm.length>1?'s':''} not added yet</b><div class="small">${inr(unm.reduce((a,o)=>a+o.amt,0))} from bank SMS isn’t counted above</div></div><span class="go">Review</span></button>`:''}
    <div class="ledger"><div><div class="k">Expenses</div><div class="v num">${tx.length}</div></div><div><div class="k">Per day</div><div class="v num">${inr(days?total/days:0)}</div></div><div><div class="k">Last ${wk?'week':'month'}</div><div class="v num">${inr(prev)}</div></div><div><div class="k">Biggest day</div><div class="v num">${byDay.length?inr(byDay.sort((a,b)=>b[1]-a[1])[0][1]):'—'}</div>${byDay.length?`<div class="tiny muted">${fmtDay(byDay[0][0])}</div>`:''}</div></div>
    <div class="panel"><div class="panel-head"><h3>Day by day</h3><span class="tiny muted">Line: daily average</span></div>${daysChart(r.s,r.e,days?total/days:0,'avg '+inr(days?total/days:0))}</div>
    ${wk?'':`<div class="panel"><div class="panel-head"><h3>Last 6 months</h3></div>${monthsChart(r.s.slice(0,7))}</div>`}
    <div class="panel"><h3 style="margin-bottom:6px">By category</h3>${donut(group(t=>t.cat||'Other'),inr(total),'spent')}${catCmp()}</div>
    ${owe?`<button class="banner" data-act="split-open">👥<div class="grow"><b>${inr(owe)} to collect from splits</b><div class="small">${ppl} ${ppl>1?'people owe':'person owes'} you a share of expenses</div></div><span class="go">See</span></button>`:''}
    <div class="panel"><h3 style="margin-bottom:6px">By payment method</h3>${bars(group(t=>(acctById(t.acc)||{}).name||'Not set'),k=>{const a=S.accounts.find(x=>x.name===k);return a?(a.type==='card'?'💳':a.type==='cash'?'💵':a.type==='wallet'?'📱':'🏦'):'•'})}</div>
    <div class="panel flush"><div class="panel-head"><h3>Biggest expenses</h3></div>${big.map(t=>`<div class="txrow"><div class="txicon">${esc(CAT_ICON[t.cat]||'•')}</div><div class="grow"><div style="font-weight:600">${esc(t.note||t.cat)}</div><div class="tiny muted">${fmtDay(t.date)}${t.time?' '+fmtTime(t.time):''}${acctById(t.acc)?' · '+esc(acctById(t.acc).name):''}</div></div><div class="txamt num neg">${inr(t.amount)}</div></div>`).join('')||'<div class="empty">No expenses.</div>'}</div>
    <button class="btn primary done" data-act="review-close">Done</button>
  </div>`;
}
function openReview(kind,start){RV.kind=kind;RV.start=start||new Date();renderReview();$('#review').classList.add('open');$('#review').scrollTop=0;document.body.classList.add('modal-open')}

function openTx(id,type,pre,extra){
  const last=S.txns.slice().sort((a,b)=>(b.created||0)-(a.created||0))[0];
  const t=id?JSON.parse(JSON.stringify(S.txns.find(x=>x.id===id))):{id:uid(),type:'expense',amount:'',acc:(UI.acctFilter!=='all'?UI.acctFilter:(last&&last.acc))||'',cat:null,note:'',date:todayS(),time:hhmm(new Date()),created:Date.now()};
  if(pre) Object.assign(t,pre);
  if(!t.cat||t.type!=='expense'){t.type='expense';t.cat=S.cats.exp.includes(t.cat)?t.cat:S.cats.exp[0]}
  const split=t.split?JSON.parse(JSON.stringify(t.split)):{me:true,ppl:[]};
  split.manual=split.ppl.length>0; // keep saved shares as they are until the user changes the split
  openModal(txEditor(t,!id),Object.assign({type:'tx',tx:t,isNew:!id,origMonth:id?t.date.slice(0,7):null,split},extra||{}));
  splitBox();
}
function readTxForm(){const t=modalCtx.tx;t.amount=$('#x-amt').value;t.acc=$('#x-acc').value;if($('#x-to'))t.to=$('#x-to').value;t.date=$('#x-date').value||todayS();t.time=$('#x-time').value||'';if(!t.time)delete t.time;const c=$('#x-cat [aria-pressed="true"]');if(c)t.cat=c.dataset.v;t.note=$('#x-note').value.trim();return t}
function saveTxFromModal(){
  const c=modalCtx,t=readTxForm(); const v=r2(t.amount);
  if(!(v>0)){$('#x-amt').focus();return toast('Enter an amount')}
  t.amount=v; delete t.to;
  const sp=c.split; sp.ppl=sp.ppl.filter(x=>personById(x.p)).map(x=>({p:x.p,amt:r2(x.amt),paid:!!x.paid}));
  if(sp.ppl.reduce((a,x)=>a+x.amt,0)>v+0.01) return toast('Shares add up to more than '+inr(v));
  if(sp.ppl.length) t.split={me:!!sp.me,ppl:sp.ppl}; else delete t.split;
  if(c.isNew) S.txns.push(t); else S.txns[S.txns.findIndex(x=>x.id===t.id)]=t;
  const ms=['money','txn_'+t.date.slice(0,7)]; if(c.origMonth&&c.origMonth!==t.date.slice(0,7)) ms.push('txn_'+c.origMonth);
  if(c.mkey) S.mcat[c.mkey]=t.cat; // remember the category for this merchant next time
  Store.mark(...ms); closeModal(); render(); toast(c.isNew?'Added '+inr(v)+' expense':'Saved');
  if(c.fromSms&&smsUnmatched().length) setTimeout(smsReviewSheet,250);
}

const personById=id=>S.people.find(p=>p.id===id);
function owed(){
  const o={}; S.people.forEach(p=>o[p.id]=0);
  S.trips.forEach(t=>(t.riders||[]).forEach(r=>{if(r in o)o[r]+=Number(t.each)||0}));
  S.pays.forEach(p=>{if(p.person in o)o[p.person]-=Number(p.amount)||0});
  Object.keys(o).forEach(k=>o[k]=r2(o[k])); return o;
}
function personLedger(pid){
  const e=[]; S.trips.forEach(t=>{if((t.riders||[]).includes(pid))e.push({kind:'trip',id:t.id,date:t.date,amt:+t.each,note:t.note,created:t.created})});
  S.pays.forEach(p=>{if(p.person===pid)e.push({kind:'pay',id:p.id,date:p.date,amt:-p.amount,note:'Paid via '+(p.mode||'UPI'),created:p.created})});
  return e.sort((a,b)=>a.date===b.date?(a.created||0)-(b.created||0):a.date<b.date?-1:1);
}
function waLink(p,amt){
  let ph=(p.phone||'').replace(/\D/g,''); if(ph.length===10) ph='91'+ph;
  const msg=`Hi ${p.name}, quick carpool update: your balance is ${inr(amt)}.`+(S.settings.upi?` You can pay to UPI ${S.settings.upi}.`:'')+' Thanks!';
  return {url:'https://wa.me/'+ph+'?text='+encodeURIComponent(msg),msg,ph};
}

  <div class="grid2">
  <div class="panel flush"><div class="panel-head"><h3>Balances</h3></div>
  ${people.map(p=>{const v=o[p.id]||0;return `<div class="prow"><div class="avatar">${esc((p.name||'?').trim()[0].toUpperCase())}</div><div class="grow"><button class="hname" data-act="cp-person" data-id="${p.id}">${esc(p.name)}</button><div class="tiny muted">${(n=>n+' trip'+(n===1?'':'s'))(personLedger(p.id).filter(e=>e.kind==='trip').length)}</div></div>

  </div>
  <div class="panel flush"><div class="panel-head"><h3>Recent activity</h3></div>
  ${acts.map(a=>a.k==='trip'?`<div class="txrow" data-act="cp-trip-edit" data-id="${a.t.id}"><div class="txicon">🚗</div><div class="grow"><b>${esc(a.t.note||'Trip')}</b><div class="tiny muted">${fmtDay(a.t.date)} · ${(a.t.riders||[]).map(r=>esc((personById(r)||{name:'?'}).name)).join(', ')}</div></div><div class="txamt num">${inr(a.t.each)} each</div></div>`:`<div class="txrow" data-act="cp-pay-edit" data-id="${a.p.id}"><div class="txicon">✅</div><div class="grow"><b>${esc((personById(a.p.person)||{name:'?'}).name)} paid</b><div class="tiny muted">${fmtDay(a.p.date)} · ${esc(a.p.mode||'UPI')}</div></div><div class="txamt num pos">+${inr(a.p.amount)}</div></div>`).join('')||'<div class="empty">No trips yet.</div>'}

function tripCalc(){
  const riders=$$('#tr-riders [aria-pressed="true"]').map(b=>b.dataset.v), mode=$('#tr-mode [aria-pressed="true"]').dataset.v;
  let each=0,total=0,me=true;
  if(mode==='fixed') each=r2($('#tr-each').value);
  else {total=+$('#tr-total').value||0;me=$('#tr-me').checked;const n=riders.length+(me?1:0);each=n?r2(total/n):0}
  return {riders,mode,each,total,includeMe:me};
}
function updateTripPreview(){const el=$('#tr-preview');if(!el)return;const c=tripCalc();el.textContent=c.riders.length&&c.each?`${c.riders.length} rider${c.riders.length>1?'s':''} × ${inr(c.each)} = ${inr(c.each*c.riders.length)} to collect`:'Pick riders and enter an amount';}

  openModal(tripEditor(t,!id),{type:'trip',trip:t,isNew:!id}); updateTripPreview();
}

function openPay(id,personId){

  const o=owed();

  if(!id) p.amount=Math.max(0,o[p.person]||0)||'';

function savePay(){
  const c=modalCtx,p=c.pay; p.person=$('#py-person').value; p.amount=r2($('#py-amt').value); p.date=$('#py-date').value||todayS(); p.mode=$('#py-mode').value;
  if(!(p.amount>0)) return toast('Enter an amount');
  const marks=['carpool'];
  const oldTx=p.txId&&S.txns.find(t=>t.id===p.txId);
  if(oldTx){marks.push('txn_'+oldTx.date.slice(0,7));S.txns=S.txns.filter(t=>t.id!==oldTx.id);delete p.txId}
  if(c.isNew) S.pays.push(p); else S.pays[S.pays.findIndex(x=>x.id===p.id)]=p;
  Store.mark(...new Set(marks)); closeModal(); render(); toast('Payment recorded');
}

}

const Snd={ctx:null,loopT:null,stopT:null,

const Q=[]; let baseTitle='Mine', flashT=null;
function upcomingAlarms(fromMs,toMs){
  const out=[];
  const push=(key,kind,id,title,sub,at,since)=>{const ms=at.getTime();if(ms>=fromMs&&ms<toMs&&ms>=(since||0))out.push({key,kind,id,title,sub,at})};
  if(modOn('tasks'))S.tasks.forEach(t=>{if(t.done||!t.due)return;const base=taskBase(t);(t.rem||[]).forEach(m=>{const at=new Date(base.getTime()-m*60000);push(t.id+'@'+t.due+'T'+(t.time||'')+'@'+m,'task',t.id,t.title,m?(REM_OPTS.find(r=>r[0]===m)||[,''])[1].replace(' before',' before it’s due'):(t.time?'Due now':'Due today'),at,(t.remSet||t.created||0)-60000)})});
  const days=[];for(let d=new Date(fromMs-86400000);d.getTime()<toMs+86400000;d=addDays(d,1))days.push(new Date(d.getFullYear(),d.getMonth(),d.getDate()));
  // Missed tasks ring every day at the chosen time, starting the day after they were due, until done
  if(modOn('tasks')&&S.settings.missedOn!==false){const [mh,mm]=(S.settings.missedTime||'09:00').split(':').map(Number);S.tasks.forEach(t=>{if(t.done||!t.due)return;const first=addDays(parseYmd(t.due),1);days.forEach(d=>{if(d<first)return;const at=new Date(d);at.setHours(mh,mm,0,0);push('m:'+t.id+'@'+ymd(d),'task',t.id,t.title,'Missed · was due '+fmtDay(t.due),at,(t.created||0)-60000)})})}
  if(modOn('habits'))S.habits.filter(h=>!h.archived).forEach(h=>days.forEach(d=>{const s=ymd(d);if(!scheduled(h,d)&&h.freq!=='weekly')return;if(doneOn(h,s))return;if(h.freq==='weekly'&&weekCount(h,startOfWeek(d))>=(h.perWeek||3))return;(h.rem||[]).forEach(r=>{const [hh,mm]=r.split(':').map(Number);const at=new Date(d);at.setHours(hh,mm,0,0);push('h:'+h.id+'@'+s+'@'+r,'habit',h.id,h.icon+' '+h.name,h.goal>1?'Goal: '+h.goal+(h.unit?' '+h.unit:''):'Time for your habit',at,(h.remSet||h.created||0)-60000)})}));
  if(modOn('money'))S.accounts.filter(a=>a.type==='card'&&a.dueDay&&a.remind!==false).forEach(a=>{const due=nextDue(a);if(!due)return;[2,0].forEach(b=>{const at=addDays(due,-b);at.setHours(10,0,0,0);push('c:'+a.id+'@'+ymd(due)+'@'+b,'card',a.id,a.name+' bill '+(b?'due in 2 days':'due today'),'Pay your card bill',at,(a.remSet||0)-60000)})});
  if(modOn('gym')&&S.gym){const r=S.gym.rem,at=(d,t,plus)=>{const [hh,mm]=(t||'07:00').split(':').map(Number);const x=new Date(d);x.setHours(hh,mm+(plus||0),0,0);return x};
    const nx=gymNext();
    days.forEach(d=>{const s=ymd(d),w=gymWeek(s);
      if(r.workout&&nx&&!S.gym.logs.some(l=>l.date===s))push('g:w@'+s,'gym','',nx.emoji+' '+nx.title,'Next workout · '+nx.label+'. Away from the gym? Do a home workout.',at(d,r.workoutTime));
      if(w<1||w>24)return;
      if(r.weigh&&[1,3,5].includes(d.getDay()))push('g:kg@'+s,'gym','','⚖️ Weigh-in','After the toilet, before food. Log it in Gym.',at(d,r.weighTime));
      if(r.waist&&d.getDate()===1)push('g:waist@'+s,'gym','','📏 Measure your waist','At the navel, then log it in Gym',at(d,r.weighTime,2));
      if(r.photo&&d.getDay()===1&&w%2===1)push('g:photo@'+s,'gym','','📸 Progress photos','Front and side, same mirror and light',at(d,r.weighTime,4));
      if(r.weekly&&d.getDay()===0){const a=dayNum(S.gym.start)+(w-1)*7,dn=S.gym.logs.filter(l=>dayNum(l.date)>=a&&dayNum(l.date)<a+7).length,avg=gymWeekAvg(w);
        push('g:week@'+s,'gym','','📊 Week '+w+' check-in',dn+' workout'+(dn===1?'':'s')+' this week'+(avg?' · average '+avg+' kg (target '+gymTargetAt(w)+' kg)':' · log your weight this week'),at(d,'19:00'))}
    })}
  Object.entries(A.snoozes).forEach(([k,v])=>push(k,v.kind,v.id,v.title,'Snoozed reminder',new Date(v.at)));
  return out.sort((a,b)=>a.at-b.at);
}
function checkAlarms(){
  if(NATIVE) return; // the Android app rings alarms natively
  const now=Date.now();
  const due=upcomingAlarms(now-12*3600000,now+1000).filter(a=>!A.fired[a.key]);
  due.forEach(a=>{a.missed=now-a.at.getTime()>3*60000;raiseAlarm(a)});
  // prune bookkeeping
  Object.keys(A.fired).forEach(k=>{if(now-A.fired[k]>4*86400000)delete A.fired[k]});
}
function raiseAlarm(a){
  if(NATIVE){if(a.kind==='focus')toast(a.title);return}
  if(A.fired[a.key]&&!a.key.startsWith('focus@')&&Q.find(x=>x.key===a.key)) return;
  A.fired[a.key]=Date.now(); if(A.snoozes[a.key]) delete A.snoozes[a.key]; Store.saveAlarms();
  Q.push(a); Q.sort((x,y)=>x.at-y.at);
  renderAlarm();
  if(!a.missed) Snd.play(S.settings.sound,true,90); else if(!Snd.loopT) Snd.play(S.settings.sound,false);
  try{navigator.vibrate&&navigator.vibrate([400,200,400,200,400])}catch(e){}
  try{if('Notification' in window&&Notification.permission==='granted'){const n=new Notification('⏰ '+a.title,{body:(a.missed?'Missed at '+fmtTime(hhmm(a.at))+'. ':'')+(a.sub||''),tag:a.key,requireInteraction:true});n.onclick=()=>{window.focus();n.close()}}}catch(e){}
  clearInterval(flashT); let f=false; flashT=setInterval(()=>{document.title=(f=!f)?'⏰ '+a.title:baseTitle},1000);
}
function renderAlarm(){
  const el=$('#alarm');
  if(!Q.length){el.classList.remove('open');el.innerHTML='';Snd.stop();clearInterval(flashT);document.title=baseTitle;return}
  const a=Q[0], sn=S.settings.snooze||10;
  const kindL={task:'Task reminder',habit:'Habit reminder',card:'Credit card bill',focus:'Focus timer',gym:'Gym'}[a.kind]||'Reminder';
  let acts='';
  if(a.kind==='task') acts=`<button class="main" data-act="al-done">Mark done</button><button data-act="al-snooze" data-v="${sn}">Snooze ${sn} min</button><button data-act="al-snooze" data-v="60">1 hour</button><button data-act="al-dismiss">Dismiss</button>`;
  else if(a.kind==='habit') acts=`<button class="main" data-act="al-hdone">Check in</button><button data-act="al-snooze" data-v="${sn}">Snooze ${sn} min</button><button data-act="al-dismiss">Skip</button>`;
  else if(a.kind==='gym') acts=`<button class="main" data-act="al-gym">Open Gym</button><button data-act="al-snooze" data-v="${sn}">Snooze ${sn} min</button><button data-act="al-dismiss">Dismiss</button>`;
  else if(a.kind==='card') acts=`<button class="main" data-act="al-money">Open Money</button><button data-act="al-snooze" data-v="240">Remind in 4 hours</button><button data-act="al-dismiss">Dismiss</button>`;
  else acts=`<button class="main" data-act="al-dismiss">OK</button>${F.mode&&a.kind==='focus'?`<button data-act="al-fnext">Start ${F.mode==='focus'?'focus':'break'}</button>`:''}`;
  el.innerHTML=`${bigBell}<div class="when num">${fmtTime(hhmm(a.at))}</div><div class="what">${esc(a.title)}</div><div class="kind">${kindL}${a.missed?' · missed while Mine was closed':''}${a.sub?' · '+esc(a.sub):''}</div><div class="acts">${acts}</div>${Q.length>1?`<div class="more">${Q.length-1} more reminder${Q.length>2?'s':''} waiting</div>`:''}<button data-act="al-silence" style="margin-top:14px;background:none;border:0;color:inherit;text-decoration:underline;font-weight:600">Silence sound</button>`;
  el.classList.add('open');
}
function alarmNext(){Q.shift();if(Q.length&&!Q[0].missed)Snd.play(S.settings.sound,true,90);else Snd.stop();renderAlarm()}

  'hip-circles':{s:['Stand with your feet hip-width apart and hands on your hips.','Push your hips forward, then to one side, back, and to the other side.','Draw 8 big, slow circles.','Reverse and do 8 the other way.'],x:['Moving your shoulders instead of your hips.']},
  'leg-swings':{s:['Stand side-on to a wall or rail and hold it with one hand.','Swing the outside leg forward and back like a pendulum.','Keep your body upright and let the swing get a little higher each time.','Do 10, then turn around and swing the other leg.','Optional: face the wall and swing each leg side to side too.'],x:['Kicking as high as you can on the first swing.','Leaning your body back and forth.']},
  'worlds-greatest':{s:['Step one foot far forward into a long lunge, back knee off the floor.','Put both hands on the floor inside your front foot.','Drop the elbow on the front-leg side toward the floor next to your foot.','Bring that hand back out, then rotate your chest and reach that arm to the ceiling.','Bring the hand down, straighten the front leg a little to stretch the hamstring, then step back.','Do 5 on one side, then 5 on the other.'],x:['Rushing; hold each position for a breath.','Letting the front knee cave inward.']},
  'ankle-rocks':{s:['Kneel on one knee with the other foot flat in front of you.','Keep that heel down and push your knee forward past your toes.','Rock back, then forward again.','Do 10, then switch sides.'],x:['Letting the heel lift off the floor.']},
  'warmup-bike':{s:['Set the seat so your knee stays slightly bent when the pedal is at the bottom.','Choose a light resistance, level 2–4 on most bikes.','Pedal at an easy, steady pace for 5 minutes.','Breathe through your nose if you can; you should be able to talk.','In the last minute, pick up the pace a little to get ready for lifting.'],x:['Pushing hard: a warm-up should leave you fresh, not tired.']},
  'bike':{s:['Set the seat to hip height when standing next to the bike.','Sit with your back straight and hands light on the handlebars.','Choose a resistance you can hold for the whole session.','Pedal at a steady 70–90 turns a minute.','Keep a pace where you can still speak in short sentences.','Slow down for the last 2 minutes to cool down.'],x:['Seat too low, which strains your knees.','Leaning all your weight on the handlebars.']},
  'incline-walk':{s:['Step onto the treadmill and start the belt at a slow walk.','Raise the incline to 8–12 once you are moving.','Set the speed to 4.5–5.5 km/h.','Walk tall with your chest up and arms swinging naturally.','Take full steps, pushing through your whole foot.','Keep the pace where you can still talk; slow down if you can’t.','Lower the incline and speed for the last 2 minutes.'],x:['Holding the handrails, which cuts the work in half.','Leaning far forward into the slope.']},
  'walk':{s:['Wear comfortable shoes and start at an easy pace for 2 minutes.','Pick up to a brisk pace where you breathe harder but can still talk.','Stand tall, look ahead and swing your arms.','Land on your heel and roll through to your toes.','Slow down for the last few minutes.'],x:['Strolling too slowly to raise your heart rate.']},
  'jog':{s:['Walk for 2–3 minutes to warm up.','Start jogging at an easy pace: you should be able to talk.','Take short, quick steps and land with your foot under your hips.','Keep your shoulders relaxed and arms bent at about 90°.','Breathe steadily; slow to a walk whenever you need to.','Finish with a few minutes of walking.'],x:['Starting too fast and stopping after a few minutes.','Long strides that land on your heel far in front of you.','Running through knee or shin pain.']},
  'rower':{s:['Strap your feet in so the strap crosses the widest part of your foot.','Sit tall, knees bent, arms straight, holding the handle: this is the catch.','Push with your legs first while your arms stay straight.','When your legs are nearly straight, lean back slightly.','Pull the handle to your lower ribs, elbows close to your body.','Return in reverse order: arms out, lean forward, then bend your knees.','On hard rounds, drive hard with your legs; on easy rounds, row gently.'],x:['Pulling with your arms before your legs push.','Rounding your back at the catch.']},
  'bike-int':{s:['Warm up first with a few easy minutes.','On a hard round, raise the resistance and pedal as fast as you can.','On an easy round, lower the resistance and spin gently to recover.','Keep switching until all rounds are done; Mine beeps at each change.','Finish with 2–3 easy minutes.'],x:['Going so hard in round 1 that the later rounds fall apart.']},

  'goblet-squat':{s:['Hold one dumbbell upright against your chest with both hands under the top end.','Stand with your feet a little wider than your hips, toes slightly out.','Take a breath and brace your stomach.','Push your hips back and bend your knees to sit down between your heels.','Keep your chest up and your elbows pointing down.','Go down until your thighs are level with the floor, or as low as you can with a flat back.','Push through your whole foot to stand up, breathing out near the top.'],x:['Knees caving inward.','Heels lifting off the floor.','Letting the dumbbell pull your chest forward.']},
  'back-squat':{s:['Set the bar on the rack at upper-chest height.','Step under it and rest it on your upper back, below your neck.','Grip just outside your shoulders and squeeze your shoulder blades together.','Stand up to lift the bar off, take two small steps back, feet shoulder-width.','Breathe in and brace your core hard.','Sit down and back, keeping your knees in line with your toes.','Go down until your thighs are at least level with the floor.','Drive up through your feet, keeping your chest up, and breathe out at the top.'],x:['Bar resting on your neck.','Knees caving in or heels lifting.','Rounding your lower back at the bottom.']},
  'leg-press':{s:['Sit with your back and hips flat against the pad.','Put your feet shoulder-width apart in the middle of the platform.','Press the platform up and release the safety handles.','Bend your knees and lower the platform slowly toward your chest.','Stop when your knees are at about 90°, before your hips lift off the seat.','Push through your heels and mid-foot to straighten your legs.','Stop just short of locking your knees, then repeat.','Lock the safety handles when you finish.'],x:['Locking your knees at the top.','Lowering so far that your lower back peels off the pad.']},
  'lat-pulldown':{s:['Set the thigh pad so your legs are snug underneath it.','Stand and grab the bar a little wider than your shoulders, palms facing forward.','Sit down with your arms straight above you.','Lean back slightly and lift your chest.','Pull your shoulder blades down, then pull the bar to your upper chest.','Squeeze your back for a second, elbows pointing down.','Let the bar rise slowly until your arms are straight again.'],x:['Swinging your body back to move the weight.','Pulling the bar behind your neck.','Letting the weight yank your arms up.']},
  'close-pulldown':{s:['Attach the close-grip V-handle to the pulldown cable.','Sit with your thighs under the pad and grab both handles, palms facing each other.','Start with your arms straight and your chest up.','Pull the handle down to your upper chest, keeping your elbows close to your sides.','Squeeze your back at the bottom for a second.','Let the handle rise slowly until your arms are straight.'],x:['Leaning far back and turning it into a row.','Shrugging your shoulders up toward your ears.']},
  'db-bench':{s:['Set the bench flat and sit at the end with a dumbbell resting on each thigh.','Lie back and use your knees to help bring the dumbbells up over your chest.','Plant your feet flat on the floor and pull your shoulder blades together into the bench.','Start with your arms straight and the dumbbells above your chest.','Breathe in and lower the dumbbells slowly to the sides of your chest.','Keep your elbows at about 45° from your body, not straight out to the sides.','Pause when your elbows are level with the bench.','Press the dumbbells back up and slightly together, breathing out near the top.','When you finish, bring the dumbbells to your chest and sit up with them on your thighs.'],x:['Flaring your elbows straight out, which strains your shoulders.','Dropping the dumbbells to the floor from the top.','Lifting your hips off the bench.']},
  'bb-bench':{s:['Lie on the bench with your eyes directly under the bar.','Grip the bar slightly wider than your shoulders.','Pull your shoulder blades together and plant your feet flat.','Lift the bar out of the rack and hold it over your shoulders with straight arms.','Breathe in and lower the bar to the middle of your chest.','Keep your elbows at about 45° from your body.','Touch your chest lightly, then press the bar up and slightly back over your shoulders.','Breathe out near the top. Rack the bar when you finish.'],x:['Bouncing the bar off your chest.','Lifting your hips off the bench.','Training heavy without a spotter or safety pins.']},
  'incline-db-press':{s:['Set the bench to a 30–45° incline.','Sit with the dumbbells on your thighs, then lie back and bring them up to your shoulders.','Feet flat, shoulder blades pulled back into the bench.','Press the dumbbells up over your upper chest.','Breathe in and lower them slowly to the sides of your upper chest.','Keep your elbows slightly tucked.','Press back up and slightly together, breathing out.'],x:['Setting the bench so steep it becomes a shoulder press.','Arching your lower back off the bench.']},
  'decline-press':{s:['Set the bench to a slight decline and hook your feet under the pads.','Lie back carefully holding a dumbbell at each side of your chest.','Press the dumbbells up over your lower chest.','Breathe in and lower them slowly to the sides of your lower chest.','Keep your elbows at about 45° from your body.','Press back up and slightly together, breathing out.','When finished, bring the dumbbells to your chest before sitting up.'],x:['Letting the dumbbells drift back over your face.','Sitting up quickly with heavy weights in your hands.']},
  'db-shoulder-press':{s:['Set the bench upright and sit with your back flat against the pad.','Lift the dumbbells to shoulder height, palms facing forward.','Feet flat, core braced.','Press the dumbbells straight up until your arms are almost straight.','Bring them slightly together at the top without clanging.','Lower slowly back to ear height.'],x:['Arching your back away from the pad.','Lowering only halfway.']},
  'machine-shoulder-press':{s:['Adjust the seat so the handles start at shoulder level.','Sit with your back flat against the pad and feet on the floor.','Grip the handles, palms forward.','Press up until your arms are nearly straight.','Lower slowly back to shoulder level.'],x:['Seat set too high, so you only move halfway.','Locking your elbows hard at the top.']},
  'seated-row':{s:['Sit on the bench with your feet on the footplate and knees slightly bent.','Grab the handle and sit up tall with your arms straight.','Pull the handle toward your belly button, keeping your elbows close.','Squeeze your shoulder blades together at the end.','Let the handle go forward slowly until your arms are straight.','Stay upright; don’t rock back and forth.'],x:['Swinging your torso to move the weight.','Rounding your back as the handle goes forward.']},
  'high-row':{s:['Adjust the seat so the handles are above your head when your arms are straight.','Sit with your chest against the pad.','Grab the handles with your arms reaching up and forward.','Pull the handles down and back toward your chest, elbows wide.','Squeeze your shoulder blades together at the end.','Return slowly until your arms are straight.'],x:['Lifting your chest off the pad.','Shrugging your shoulders up.']},
  'chest-row':{s:['Set an incline bench to about 30–45°.','Lie face down with your chest on the pad and a dumbbell in each hand.','Let your arms hang straight down, palms facing each other.','Pull the dumbbells up toward your hips, elbows close to your body.','Squeeze your shoulder blades together at the top.','Lower slowly until your arms are straight.'],x:['Lifting your chest off the pad to swing the weight up.','Shrugging instead of rowing.']},
  'db-rdl':{s:['Stand with your feet hip-width apart, a dumbbell in each hand in front of your thighs.','Unlock your knees slightly and keep them there.','Push your hips back as if closing a door behind you.','Let the dumbbells slide down the front of your legs, back flat.','Go down until you feel a strong stretch in your hamstrings, usually just below the knees.','Squeeze your glutes and push your hips forward to stand up.'],x:['Rounding your back.','Bending your knees so much it becomes a squat.','Letting the dumbbells drift away from your legs.']},
  'rdl':{s:['Stand with the barbell in front of your thighs, hands just outside your legs.','Feet hip-width apart, knees slightly bent.','Brace your core and pull your shoulders back.','Push your hips back and lower the bar along your thighs.','Keep your back flat and the bar touching your legs.','Lower to mid-shin or until your back starts to round.','Drive your hips forward to stand tall.'],x:['Rounding your lower back.','Letting the bar swing away from your body.']},
  'walking-lunge':{s:['Stand tall with a dumbbell in each hand at your sides, or with no weight.','Take a long step forward with one leg.','Lower your body until your back knee nearly touches the floor.','Keep your front knee over your ankle and your torso upright.','Push through your front heel and bring your back leg forward into the next step.','Alternate legs as you walk.'],x:['Steps so short your front knee shoots past your toes.','Leaning forward over the front leg.']},
  'reverse-lunge':{s:['Stand tall with your feet hip-width apart.','Take a big step back with one foot.','Lower until your back knee nearly touches the floor.','Keep most of your weight on the front heel.','Push through the front foot to step back to standing.','Do all reps on one side, or alternate legs.'],x:['Front knee caving inward.','Leaning your torso far forward.']},
  'jump-lunge':{s:['Start in a lunge with one foot forward and both knees bent.','Swing your arms and jump straight up.','Switch legs in the air.','Land softly in a lunge with the other leg forward.','Go straight into the next jump.'],x:['Landing stiff-legged.','Front knee collapsing inward on landing.']},
  'bulgarian':{s:['Stand about two steps in front of a bench, facing away from it.','Put the top of one foot on the bench behind you.','Hold a dumbbell in each hand, or none to start.','Lower straight down until your front thigh is about level with the floor.','Keep your front heel down and your chest up.','Push through the front heel to stand back up.','Finish all reps, then switch legs.'],x:['Standing too close to the bench.','Pushing off the back foot instead of the front leg.']},
  'hip-thrust':{s:['Sit on the floor with your upper back against the side of a bench.','Roll a barbell over your legs to rest on your hips (use a pad).','Bend your knees with your feet flat, shoulder-width apart.','Push through your heels to lift your hips until your body is straight from shoulders to knees.','Squeeze your glutes hard at the top, chin tucked.','Lower your hips slowly toward the floor.'],x:['Arching your lower back at the top instead of squeezing your glutes.','Feet too far away, which moves the work to your hamstrings.']},
  'glute-bridge':{s:['Lie on your back with your knees bent and feet flat, hip-width apart.','Arms by your sides, palms down.','Push through your heels to lift your hips.','Stop when your knees, hips and shoulders are in a line.','Squeeze your glutes for a second at the top.','Lower slowly.','For single-leg bridges, lift one foot off the floor and do the same.'],x:['Pushing up with your lower back instead of your glutes.']},
  'assisted-pullup':{s:['Set the assist weight: more weight gives more help.','Kneel or stand on the pad and grab the handles just wider than your shoulders.','Start hanging with your arms straight.','Pull your shoulder blades down, then pull until your chin is above the handles.','Lower slowly until your arms are straight.','Reduce the assist weight over the weeks as you get stronger.'],x:['Doing half reps without straightening your arms.','Swinging or kicking.']},
  'hanging-knee-raise':{s:['Hang from a pull-up bar with your arms straight.','Tighten your stomach to stop any swinging.','Bring your knees up toward your chest.','Curl your hips slightly at the top.','Lower your legs slowly.'],x:['Swinging to get your legs up.','Dropping your legs quickly.']},
  'machine-chest-press':{s:['Adjust the seat so the handles line up with the middle of your chest.','Sit with your back flat against the pad.','Grab the handles and press them forward.','Stop just before your elbows lock.','Return slowly until you feel a stretch across your chest.'],x:['Seat at the wrong height.','Letting the weight stack crash down.']},
  'leg-curl':{s:['Adjust the machine so your knees line up with its pivot point.','Put the pad just above your heels.','Hold the handles to keep your hips down.','Curl your heels toward your glutes as far as you can.','Squeeze your hamstrings at the end.','Return slowly to the start.'],x:['Lifting your hips to get more range.','Letting the weight drop back.']},
  'leg-extension':{s:['Adjust the back pad so your knees line up with the machine’s pivot.','Put the lower pad on the front of your ankles.','Hold the side handles.','Straighten your legs until they are fully extended.','Squeeze your thighs for a second.','Lower slowly to the start.'],x:['Kicking the weight up fast.','Lifting your hips off the seat.']},
  'lateral-raise':{s:['Stand tall with a dumbbell in each hand at your sides.','Keep a slight bend in your elbows.','Raise your arms out to the sides, leading with your elbows.','Stop at shoulder height.','Lower slowly to your sides.'],x:['Swinging the weights with your body.','Shrugging your shoulders up.','Going too heavy; light weight works best here.']},
  'face-pull':{s:['Set a cable pulley at face height with a rope attached.','Hold the rope ends, palms facing each other, and step back until your arms are straight.','Pull the rope toward your face, splitting the ends apart.','Lead with your elbows, keeping them high.','Finish with your hands beside your ears.','Return slowly.'],x:['Elbows dropping down, which turns it into a row.','Leaning back to pull the weight.']},
  'farmers-carry':{s:['Stand between two heavy dumbbells.','Bend your knees and grab them with a firm grip.','Stand up tall, shoulders back, core tight.','Walk with short, steady steps for the set distance.','Put the weights down by bending your knees.'],x:['Leaning to one side.','Picking up the weights with a rounded back.']},
  'plank':{s:['Kneel on the floor with your forearms flat, elbows under your shoulders.','Step your feet back so your body is straight from head to heels.','Squeeze your glutes and tighten your stomach.','Look at the floor just in front of your hands.','Hold while breathing steadily.'],x:['Hips sagging toward the floor.','Hips piked up high.','Holding your breath.']},
  'side-plank':{s:['Lie on one side with your elbow directly under your shoulder.','Stack your feet, or put one in front of the other.','Lift your hips so your body is straight from head to feet.','Keep your hips pushed forward.','Hold, then switch sides.'],x:['Hips dropping toward the floor.','Rolling your chest forward.']},
  'cable-crunch':{s:['Attach a rope to a high cable pulley.','Kneel facing the machine and hold the rope beside your head.','Keep your hips still above your knees.','Curl your chest down toward your knees by tightening your stomach.','Pause at the bottom.','Rise slowly back up.'],x:['Pulling with your arms.','Sitting back on your heels so your hips move.']},
  'triceps-pushdown':{s:['Attach a bar or rope to a high cable pulley.','Stand close, grab it and pin your elbows to your sides.','Push down until your arms are straight.','Squeeze the back of your arms.','Let it rise slowly until your forearms are about level with the floor.'],x:['Elbows moving forward and back.','Leaning over the weight to push it down.']},
  'kickback':{s:['Hold a dumbbell in one hand and put the other hand and knee on a bench.','Keep your back flat and raise your upper arm level with your body.','Bend your elbow to about 90°.','Straighten your arm behind you.','Squeeze the back of your arm at the top.','Lower slowly to 90°. Finish the set, then switch arms.'],x:['Upper arm dropping down as you get tired.','Swinging the weight.']},
  'db-curl':{s:['Stand tall with a dumbbell in each hand, palms facing forward.','Keep your elbows close to your sides.','Curl the dumbbells up toward your shoulders.','Squeeze your biceps at the top.','Lower slowly until your arms are straight.'],x:['Swinging your body to lift the weight.','Elbows drifting forward.']},
  'bb-curl':{s:['Stand tall holding a barbell or EZ bar with an underhand, shoulder-width grip.','Keep your elbows by your sides.','Curl the bar up toward your chest.','Squeeze at the top.','Lower slowly until your arms are straight.'],x:['Rocking your back to swing the bar up.','Cutting the lowering short.']},
  'preacher-curl':{s:['Adjust the seat so your armpits sit snugly on the top of the pad.','Rest the backs of your arms flat on the pad.','Grab the handles with palms facing up.','Curl up until your forearms are nearly vertical.','Lower slowly until your arms are almost straight.'],x:['Lifting your elbows off the pad.','Dropping the weight quickly.']},
  'hammer-curl':{s:['Stand with a dumbbell in each hand, palms facing your body.','Keep your elbows close to your sides.','Curl the dumbbells up, keeping your palms facing in.','Squeeze at the top.','Lower slowly.'],x:['Swinging the weights.']},
  'oh-triceps':{s:['Sit or stand holding one dumbbell with both hands under the top end.','Press it up overhead with straight arms.','Keeping your elbows pointing up, lower the dumbbell behind your head.','Go down until you feel a stretch in the back of your arms.','Straighten your arms to lift it back up.'],x:['Elbows flaring wide.','Arching your lower back.']},
  'trap-bar-deadlift':{s:['Step into the middle of the trap bar, feet hip-width apart.','Bend your hips and knees to grab the handles.','Chest up, back flat, arms straight.','Breathe in and brace your core.','Push the floor away with your legs and stand up tall.','Lower the bar by pushing your hips back and bending your knees.'],x:['Rounding your back.','Jerking the bar off the floor.']},
  'calf-raise':{s:['Stand with the balls of your feet on a step or the machine platform.','Let your heels drop for a stretch.','Rise up onto your toes as high as you can.','Pause at the top for a second.','Lower slowly into the stretch.'],x:['Bouncing quickly at the bottom.','Bending your knees to help.']},
  'dead-bug':{s:['Lie on your back with your arms pointing to the ceiling.','Lift your legs with knees bent at 90°.','Press your lower back flat into the floor.','Slowly lower one arm behind your head and the opposite leg toward the floor.','Return to the start and switch sides.'],x:['Lower back arching off the floor.','Moving fast.']},
  'woodchop':{s:['Set a cable pulley high and stand side-on to it.','Grab the handle with both hands above your shoulder.','Pull it diagonally down across your body toward the opposite hip.','Turn through your hips and feet as you pull.','Return slowly. Finish the set, then switch sides.'],x:['Using only your arms.','Twisting your lower back without turning your hips.']},
  'leg-raise':{s:['Lie on your back with your hands under your hips.','Press your lower back into the floor.','Keeping your legs straight, raise them until they point at the ceiling.','Lower them slowly until just above the floor.','Don’t let your lower back lift.'],x:['Arching your lower back as your legs go down.','Dropping your legs fast.']},
  'russian-twist':{s:['Sit with your knees bent and feet on the floor (or lifted for harder).','Lean back slightly with a straight back.','Hold your hands or a weight in front of your chest.','Turn your shoulders to one side and touch beside your hip.','Turn to the other side. Each side counts as one rep.'],x:['Moving only your arms instead of turning your torso.','Rounding your back.']},
  'bw-squat':{s:['Stand with your feet shoulder-width apart, toes slightly out.','Reach your arms forward for balance.','Push your hips back and bend your knees.','Go down until your thighs are level with the floor.','Keep your chest up and heels down.','Stand up by pushing through your feet.'],x:['Knees caving inward.','Heels lifting off the floor.']},
  'jump-squat':{s:['Start in a squat with your thighs about level with the floor.','Swing your arms and jump straight up.','Land softly on the balls of your feet, then your heels.','Bend straight into the next squat.'],x:['Landing with straight legs.','Knees caving in on landing.']},
  'push-up':{s:['Put your hands on the floor just wider than your shoulders.','Step your feet back so your body is straight from head to heels.','Tighten your stomach and glutes.','Lower your chest until it is just above the floor, elbows at about 45°.','Push back up to straight arms.','Easier: knees on the floor. Harder: feet on a step.'],x:['Hips sagging.','Elbows flaring straight out.','Only going halfway down.']},
  'mountain-climber':{s:['Start at the top of a push-up with your hands under your shoulders.','Bring one knee toward your chest.','Switch legs quickly, like running in place.','Keep your hips low and your back flat.'],x:['Hips bouncing high.','Hands drifting in front of your shoulders.']},
  'burpee':{s:['Stand with your feet hip-width apart.','Squat down and put your hands on the floor.','Jump your feet back into a push-up position.','Lower your chest to the floor or do a push-up.','Jump your feet back toward your hands.','Jump up with your arms overhead.'],x:['Landing hard on your knees or wrists.','Letting your back sag in the plank.']}
};

  const d=new Date(),m=addDays(d,(8-d.getDay())%7); // next Monday, or today if it is Monday
  return {start:ymd(m),program:'five',v2:1,rounds:3,pos:{five:0,trainer:0,plan:0},startW:96,goalW:81,logs:[],body:[],cur:null,
    rem:{workout:true,workoutTime:'08:30',weigh:true,weighTime:'07:00',waist:true,photo:true,weekly:true}};
}
function gymInit(){
  const d=gymDefaults(),old=S.gym&&!S.gym.v2;S.gym=Object.assign(d,S.gym||{});S.gym.rem=Object.assign(d.rem,S.gym.rem||{});S.gym.pos=Object.assign({five:0,trainer:0,plan:0},S.gym.pos||{});
  if(old){S.gym.v2=1;S.gym.program='five'} // move existing data onto the 5-day plan once
  if(S.gym.cur&&S.gym.cur.key==null) S.gym.cur=null; // workouts started before they were ordered by number
}
// Calendar weeks since the start date; only weight targets and weigh-ins use dates
const gymWeek=s=>Math.floor((dayNum(s)-dayNum(S.gym.start))/7)+1;
const gymPos=()=>S.gym.pos[gymProg()]||0;
// Workout number i in the program's order, with no dates: the trainer's Day 1–6 on repeat, or the guide's 24 weeks × 7 days
function gymSeq(i){return withWarmup(gymSeqRaw(i))}
function gymSeqRaw(i){
  if(gymRot()){const L=gymRotLen(),d=((i%L)+L)%L;return Object.assign({seq:i,label:(gymProg()==='five'?'Week '+(Math.floor(i/L)+1)+' · ':'')+'Day '+(d+1),week:Math.floor(i/L)+1},gymProg()==='five'?fiveDay(d,Math.floor(i/L)+1):trainerDay(1,d+1))}
  if(i<0||i>=168) return null;
  const w=Math.floor(i/7)+1,d=i%7;return Object.assign({seq:i,label:'Week '+w+' · Day '+(d+1),week:w},gymDay(w,[1,2,3,4,5,6,0][d]));
}
// Daily warm-up before every workout; gym days end it with 3 minutes on the bike
const WARMUP=[['neck-roll','5 each direction'],['arm-circles','10 forward, 10 backward'],['shoulder-rolls','10'],['torso-twist','10 per side'],['hip-circles','8 each direction'],['leg-swings','10 per leg'],['worlds-greatest','5 per side'],['ankle-rocks','10 per side'],['bw-squat','10']];
function withWarmup(x){
  if(!x||x.kind==='walk'||x.items.some(i=>i.wu)) return x;
  const items=x.items.slice(),f=items[0];
  if(f&&(f.ex==='warmup-bike'||(f.ex==='walk'&&/warm/.test(f.note||'')))) items.shift();
  const wu=WARMUP.map(([ex,reps])=>({ex,sets:1,reps,rest:0,wu:true}));
  if(x.kind==='gym') wu.push({ex:'warmup-bike',mins:3,note:'3 min easy bike to finish the warm-up',wu:true});
  return Object.assign({},x,{items:wu.concat(items)});
}
const gymNext=()=>gymSeq(gymPos());
const gymSeqDone=i=>S.gym.logs.some(l=>l.seq===i&&l.prog===gymProg());
const gymKey=x=>x.home?'h:'+x.home:String(x.seq);
// For days at home or travelling: mostly running and cardio, a little bodyweight work. The gym workout stays next in line.
// For days at home or travelling: mostly running and cardio, a little bodyweight work. The gym workout stays next in line.
// The run builds up like the guide: jog/walk intervals first, continuous running later.
function gymHome(k){return withWarmup(gymHomeRaw(k))}
function gymHomeRaw(k){
  const w=fiveWeek(),lv=fiveLevel(w),run=(mins)=>w<=4?{ex:'jog',type:'interval',rounds:Math.round(mins/3),work:60,rest:120,note:Math.round(mins/3)+' × 1 min jog + 2 min walk'}
    :w<=8?{ex:'jog',type:'interval',rounds:Math.round(mins/3),work:120,rest:60,note:Math.round(mins/3)+' × 2 min jog + 1 min walk'}
    :{ex:'jog',mins,note:mins+' min easy run; walk when you need to'};
  const tail='Your gym workout stays next in line for when you’re back.';
  if(k==='cardio'){const m=w<=2?24:w<=6?30:w<=12?35:40;
    return {home:'cardio',kind:'home',label:'Home / travel · week '+w,title:'Cardio only',emoji:'🏃',items:[{ex:'walk',mins:5,note:'5 min easy walk to warm up'},run(m),{ex:'walk',mins:10,note:'10 min easy walk to cool down'}],note:'No space to run? Brisk walk or cycle for the same time. '+tail}}
  const R=lv.rounds,m=w<=2?15:w<=6?18:w<=12?20:25,hard=w>12;
  return {home:'run',kind:'home',label:'Home / travel · week '+w,title:'Run + light exercise',emoji:'🏠',circuit:R,items:[{ex:'walk',mins:5,note:'5 min brisk walk to warm up'},run(m),
    {ex:hard?'jump-squat':'bw-squat',sets:R,reps:w<=2?'12':hard?'12':'15',rest:0},{ex:'push-up',sets:R,reps:w<=2?'8 (knees if needed)':w<=6?'10':'12',rest:0},{ex:'glute-bridge',sets:R,reps:w<=6?'15':'15 single-leg, each leg',rest:0},
    {ex:'plank',sets:R,reps:w<=2?'20 sec':w<=6?'30 sec':w<=12?'45 sec':'60 sec',rest:0},{ex:'mountain-climber',sets:R,reps:w<=2?'16':w<=6?'20':w<=12?'30':'40',rest:0},
    {ex:'walk',mins:5,note:'5 min easy walk to cool down'}],note:'Mostly cardio with a little bodyweight work, no equipment. '+tail}
}
function gymMotiv(s){const n=dayNum(s||todayS())-dayNum(S.gym.start);return GMOTIV[((n%GMOTIV.length)+GMOTIV.length)%GMOTIV.length]}
function gymItemLine(it,circ){
  if(it.wu) return it.reps||it.note||'';
  const t=it.type||exType(it.ex);
  if(it.rounds) return it.note||`${it.rounds} × ${it.work}s hard / ${it.rest}s easy`;
  if(it.mins) return it.note||`${it.mins} min`;
  return `${circ?'':it.sets+' × '}${it.reps}${t==='reps'&&!/per|sec|m$/.test(it.reps)?' reps':''}${it.rest?' · rest '+it.rest+'s':''}`;
}
// Best and last sets for an exercise across saved workouts
function gymHist(ex){const out=[];S.gym.logs.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(l=>(l.items||[]).forEach(it=>{if(it.ex===ex&&it.sets&&it.sets.length)out.push({date:l.date,sets:it.sets})}));return out}
const e1rm=(w,r)=>w>0&&r>0?r2(w*(1+r/30)):0;
function gymBest(ex){let b=null;gymHist(ex).forEach(h=>h.sets.forEach(s=>{if(+s.w>0&&(!b||+s.w>+b.w||(+s.w===+b.w&&+s.r>+b.r)))b={w:+s.w,r:+s.r,date:h.date}}));return b}
const gymLast=ex=>{const h=gymHist(ex);return h.length?h[h.length-1]:null};
function gymWeekAvg(w){const a=dayNum(S.gym.start)+(w-1)*7,v=S.gym.body.filter(b=>b.w&&dayNum(b.date)>=a&&dayNum(b.date)<a+7).map(b=>+b.w);return v.length?r2(v.reduce((x,y)=>x+y,0)/v.length):null}

/* ================= gym: screens ================= */
function viewGym(){
  gymInit();
  const tab=UI.gymTab||'today',nx=gymNext();
  const sub=!nx?'6-month plan complete 🎉':gymRot()?`Next: ${nx.label} · ${GPROG_N[gymProg()]}`:`${nx.label} · ${GPHASE_N[GPHASE(nx.week)]}`;
  const body=tab==='plan'?gymPlanTab():tab==='progress'?gymProgressTab():gymTodayTab();
  return `<div class="page-head"><div><h1>Gym</h1><div class="sub">${sub}</div></div><div class="row"><div class="seg">${[['today','Today'],['plan','Plan'],['progress','Progress']].map(([k,l])=>`<button data-act="gym-tab" data-v="${k}" aria-pressed="${tab===k}">${l}</button>`).join('')}</div><button class="icon-btn" data-act="gym-settings" aria-label="Gym settings">${I.gear}</button></div></div>${body}`;
}

    <div class="row wrap" style="margin-top:12px;gap:8px"><button class="btn ${done?'':'primary'} grow gstart" data-act="gym-start" data-v="${key}">${I.play} ${cur?'Resume workout':done?'Do it again':'Start workout'}</button>${opts.extra||''}</div></div>`;
}
function gymHomePanel(){
  return `<div class="panel"><h3>🏠 At home or travelling?</h3><p class="small muted" style="margin:6px 0 10px">Do this instead of today’s gym workout: mostly running and cardio, with a little bodyweight work. Your gym workout stays next in line.</p>
    <div class="row wrap" style="gap:8px"><button class="btn grow" data-act="gym-home" data-v="run">🏃 Run + light exercise</button><button class="btn grow" data-act="gym-home" data-v="cardio">🚶 Cardio only</button></div></div>`;
}
// Big "Week N" banner: where you are in the plan, what stage, which day is next
function gymWeekHero(nx){
  if(!nx) return '';
  const w=nx.week,prog=gymProg(),L=prog==='plan'?7:gymRotLen(),d=nx.seq%L+1;
  const stage=prog==='five'?fiveLevel(w):null,name=prog==='five'?stage.name:prog==='plan'?GPHASE_N[GPHASE(w)]:'Gym’s circuit';
  const detail=prog==='five'?`${stage.rounds} rounds · ${stage.fin} min finisher${stage.deload?' · lighter week':''}`:prog==='plan'&&gymDeload(w)?'Deload week':'';
  const doneThisWeek=[...Array(L)].filter((_,i)=>gymSeqDone(nx.seq-nx.seq%L+i)).length;
  return `<div class="gweekhero"><div class="gwh-num"><span>WEEK</span><b class="num">${w}</b>${prog==='trainer'?'':'<i>of 24</i>'}</div>
    <div class="grow" style="min-width:0"><div class="gwh-stage">${esc(name)}</div><div class="gwh-day">Next up: <b>Day ${d} of ${L}</b></div>${detail?`<div class="tiny muted">${esc(detail)}</div>`:''}
    <div class="gwh-bar" aria-label="${doneThisWeek} of ${L} done this week">${[...Array(L)].map((_,i)=>`<i class="${i<doneThisWeek?'on':''}${i===d-1?' cur':''}"></i>`).join('')}</div></div></div>`;
}
function gymTodayTab(){
  const n=todayS(),nx=gymNext(),nu=GNUTR(Math.max(1,Math.min(24,gymWeek(n)))),today=S.gym.logs.filter(l=>l.date===n);

    strip=[...Array(cnt)].map((_,i)=>{const s=gymSeq(n0+i),d=gymSeqDone(n0+i);return `<button class="gday${n0+i===nx.seq?' now':''}${d?' done':''}" data-act="gym-day" data-v="${n0+i}"><span>D${i+1}</span><b>${d?'✓':s.emoji}</b></button>`}).join('');}
  return `${gymWeekHero(nx)}<div class="gmotiv"><span>💬</span><div>${esc(gymMotiv(n))}</div></div>
  ${strip?`<div class="gweek" style="grid-template-columns:repeat(${gymRot()?gymRotLen():7},1fr)">${strip}</div>`:''}
  <div class="grid2"><div>${main}</div><div>
    ${nx?`<div class="panel"><h3>Tip</h3><p class="small muted" style="margin:6px 0 0">${esc(gymWeekTip(nx.week))}</p></div>`:''}
    <div class="panel"><div class="panel-head"><h3>Today’s food targets</h3></div><div class="gnut"><div><b class="num">${nu.k.toLocaleString('en-IN')}</b><span>kcal</span></div><div><b class="num">${nu.p} g</b><span>protein</span></div><div><b class="num">${nu.c} g</b><span>carbs</span></div><div><b class="num">${nu.f} g</b><span>fat</span></div></div><p class="tiny muted" style="margin:8px 0 0">Protein first: 4 meals of 30–40 g. Drink 3–4 litres of water.</p></div>
    <div class="panel"><div class="panel-head"><h3>Body</h3><button class="btn sm" data-act="gym-weigh">${I.plus} Log weight</button></div>${gymBodySummary()}</div>
  </div></div>`;
}
function gymBodySummary(){
  const b=S.gym.body.filter(x=>x.w).sort((a,c)=>a.date<c.date?-1:1),last=b[b.length-1],w=gymWeek(todayS());
  if(!last) return `<div class="empty" style="padding:10px">Weigh yourself Mon, Wed and Fri mornings after the toilet, before food. Mine reminds you.</div>`;
  const lost=r2(S.gym.startW-last.w),tg=gymTargetAt(Math.max(0,w));

function fiveLadder(){
  const w=fiveWeek(),rows=[[1,2,'1–2'],[3,4,'3–4'],[5,6,'5–6'],[7,11,'7–11'],[12,12,'12'],[13,17,'13–17'],[18,18,'18'],[19,24,'19+']];

    ${rows.map(([a,b,l])=>{const lv=fiveLevel(a),on=w>=a&&(w<=b||(b===24));return `<div class="row small" style="padding:6px 8px;border-radius:8px;${on?'background:var(--soft);':''}"><b style="min-width:62px">Wk ${l}</b><span class="grow">${esc(lv.name)}</span><span class="tiny muted" style="text-align:right">${lv.rounds} rounds · ${lv.fin} min finisher${lv.heavy?' · heavier':''}</span></div>`}).join('')}</div>`;
}
function gymPlanTab(){
  const p=gymPos(),row=(s,i)=>`<button class="gitem" data-act="gym-day" data-v="${s.seq}"><span class="gnum">D${i+1}</span><span class="grow"><b>${s.emoji} ${esc(s.title)}</b><span class="tiny muted">${s.items.length} item${s.items.length>1?'s':''}${s.seq===p?' · next up':''}</span></span>${gymSeqDone(s.seq)?`<span class="pos">${I.check}</span>`:I.right}</button>`;
  // the 5-day plan: every week laid out, grouped by stage, like the 6-month guide
  if(gymProg()==='five'){
    const cw=fiveWeek(),sub=s=>{const n=s.items.filter(i=>i.sets).length,f=s.items[s.items.length-1];return (s.circuit?s.circuit+' rounds · ':'')+n+' exercises'+(f&&!f.sets&&s.items.indexOf(f)>0?' · '+(f.mins?f.mins+' min '+(f.ex==='bike'?'bike':'walk'):f.rounds+' intervals'):'')};
    const drow=(x,i)=>`<button class="gitem" data-act="gym-day" data-v="${x.seq}"><span class="gnum">D${i+1}</span><span class="grow"><b>${x.emoji} ${esc(x.title)}</b><span class="tiny muted">${esc(sub(x))}${x.seq===p?' · next up':''}</span></span>${gymSeqDone(x.seq)?`<span class="pos">${I.check}</span>`:I.right}</button>`;

    for(let w=1;w<=24;w++){
      const lv=fiveLevel(w); if(lv.name!==last){html+=`<h3 class="gphase">${esc(lv.name)}</h3>`;last=lv.name}
      const ss=[...Array(5)].map((_,i)=>gymSeq((w-1)*5+i)),done=ss.filter(x=>gymSeqDone(x.seq)).length,open=UI.gymWeekOpen===w||(UI.gymWeekOpen==null&&w===cw);
      html+=`<div class="panel gwk${w===cw?' cur':''}"><button class="gwk-h" data-act="gym-week" data-v="${w}"><b>Week ${w}${lv.deload?' · deload':''}</b><span class="tiny muted">${lv.rounds} rounds · ${lv.fin} min finisher</span><span class="grow"></span><span class="tiny ${done?'pos':'muted'}">${done}/5</span></button>
        ${open?`<div style="margin-top:8px">${ss.map(drow).join('')}<p class="tiny muted" style="margin:8px 2px 0">${esc(gymWeekTip(w))}</p></div>`:''}</div>`;

  let html='';const cw=Math.floor(p/7)+1;
  for(let w=1;w<=24;w++){
    if(w===1||w===7||w===13) html+=`<h3 class="gphase">${w===1?'Weeks 1–6':w===7?'Weeks 7–12':'Weeks 13–24'} · ${GPHASE_N[GPHASE(w)]}</h3>`;
    const ss=[...Array(7)].map((_,i)=>gymSeq((w-1)*7+i)),done=ss.filter(s=>gymSeqDone(s.seq)).length,open=UI.gymWeekOpen===w||(UI.gymWeekOpen==null&&w===cw);
    html+=`<div class="panel gwk${w===cw?' cur':''}"><button class="gwk-h" data-act="gym-week" data-v="${w}"><b>Week ${w}${gymDeload(w)?' · deload':''}</b><span class="grow"></span><span class="tiny ${done?'pos':'muted'}">${done}/7</span></button>

  }
  return html;
}
// Small line chart: weight entries plus the plan's target line
function gymWeightChart(){

  const W=320,H=150,P=26,s0=dayNum(S.gym.start),xs=d=>P+(Math.max(-7,Math.min(168,d-s0))+7)/175*(W-P-6);
  const vals=b.map(x=>+x.w).concat(GTARGET),mn=Math.floor(Math.min(...vals)-1),mx=Math.ceil(Math.max(...vals)+1),ys=v=>6+(mx-v)/(mx-mn)*(H-26);
  const tgt=GTARGET.map((v,i)=>`${xs(s0+i*28).toFixed(1)},${ys(v).toFixed(1)}`).join(' ');
  const pts=b.map(x=>[xs(dayNum(x.date)),ys(+x.w)]);
  const avg=[];for(let w=1;w<=24;w++){const a=gymWeekAvg(w);if(a!=null)avg.push([xs(s0+(w-1)*7+3),ys(a)])}
  const yl=[mn,Math.round((mn+mx)/2),mx];
  return `<svg class="gchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight chart">
    ${yl.map(v=>`<line x1="${P}" x2="${W-4}" y1="${ys(v)}" y2="${ys(v)}" class="gl"/><text x="2" y="${ys(v)+4}" class="gt">${v}</text>`).join('')}
    ${[0,4,8,12,16,20,24].map(w=>`<text x="${xs(s0+w*7)}" y="${H-4}" class="gt" text-anchor="${w===24?'end':'middle'}">${w?'W'+w:'Start'}</text>`).join('')}
    <polyline points="${tgt}" class="gtg"/>
    ${avg.length>1?`<polyline points="${avg.map(p=>p.join(',')).join(' ')}" class="gavg"/>`:''}
    ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.6" class="gpt"/>`).join('')}
  </svg><div class="tiny muted row" style="gap:14px;margin-top:4px"><span><i class="gkey tg"></i>Plan target</span><span><i class="gkey avg"></i>Weekly average</span><span><i class="gkey pt"></i>Weigh-ins</span></div>`;
}
function gymProgressTab(){

  const wd=logs.filter(l=>dayNum(n)-dayNum(l.date)<7).length;
  const avgs=[w-3,w-2,w-1,w].filter(x=>x>=1).map(x=>({w:x,a:gymWeekAvg(x),t:gymTargetAt(x)}));

const GP={tick:0,lastPhase:null};
function gymSteps(x){
  const st=[];
  const isC=it=>it.sets&&!it.wu;
  if(x.circuit){const f=x.items.findIndex(isC);x.items.forEach((it,i)=>{if(!isC(it)&&i<f)st.push({i,s:0})});for(let r=0;r<x.circuit;r++)x.items.forEach((it,i)=>{if(isC(it))st.push({i,s:r})});x.items.forEach((it,i)=>{if(!isC(it)&&i>f)st.push({i,s:0})})}
  else x.items.forEach((it,i)=>{const n=it.sets||1;for(let s=0;s<n;s++)st.push({i,s})});
  return st;
}
const gymByKey=k=>String(k).startsWith('h:')?gymHome(String(k).slice(2)):gymSeq(+k);

function gymStart(key){

    if(!S.gym.cur||S.gym.cur.key!==key) S.gym.cur={key,seq:x.home?null:x.seq,home:x.home||null,started:Date.now(),at:0,restEnd:0,tm:null,items:x.items.map(it=>({ex:it.ex,sets:[...Array(it.sets||1)].map(()=>({w:'',r:'',done:false}))}))};
    Store.mark('gym'); closeModal();
    let el=$('#gymplay'); if(!el){el=document.createElement('div');el.id='gymplay';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');document.body.appendChild(el)}
    el.classList.add('open');document.body.classList.add('modal-open','gp-open');
    try{window.MineNative.keepAwake(true)}catch(e){}
    clearInterval(GP.tick);GP.tick=setInterval(gpTick,250);

  };
  const c=S.gym.cur;
  if(c&&c.key!==key&&!c.finished&&c.items.some(l=>l.sets.some(s=>s.done))) confirmBox('You have an unfinished workout. Drop it and start this one?','Start this one',go); else go();
}
function gpClose(){

const gpSess=()=>gymByKey(S.gym.cur.key);
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+pad(s%60)};
function gpBeep(n){try{Snd.unlock();if(Snd.ready()){const t=Snd.ctx.currentTime+.02;for(let i=0;i<(n||2);i++)Snd.tone(988,t+i*.22,.16,'sine',.3)}}catch(e){}try{navigator.vibrate&&navigator.vibrate(n>2?[300,120,300,120,300]:[250,120,250])}catch(e){}}

      ${log.sets.map((s,k)=>{const ls=last?last.sets[Math.min(k,last.sets.length-1)]:null,isCur=k===st.s;return `<div class="gset${isCur?' cur':''}${s.done?' done':''}"><span class="num">${x.circuit?'R':''}${k+1}</span><span class="tiny muted">${ls?(ls.w?ls.w+'×':'')+(ls.r||'—'):'—'}</span>${exBW(it.ex)?'<span class="tiny muted" style="text-align:center">body</span>':`<input class="in num gp-in" data-i="${st.i}" data-s="${k}" data-f="w" type="number" inputmode="decimal" step="0.5" value="${s.w}" placeholder="${ls&&ls.w?ls.w:''}" aria-label="Weight set ${k+1}">`}<input class="in num gp-in" data-i="${st.i}" data-s="${k}" data-f="r" type="number" inputmode="numeric" value="${s.r}" placeholder="${(String(it.reps).match(/\d+/g)||[''])[0]}" aria-label="${unit} set ${k+1}"><button class="gtick" data-act="gp-set" data-i="${st.i}" data-s="${k}" aria-pressed="${s.done}" aria-label="Set ${k+1} done">${I.check}</button></div>`}).join('')}
      <div class="row wrap" style="gap:8px;margin-top:10px">${log.sets.some(z=>!z.done)?`<button class="btn sm primary" data-act="gp-all" data-i="${st.i}">${I.check} All ${x.circuit?'rounds':'sets'} done</button>`:''}${log.sets.some(z=>z.done||z.w!==''||z.r!=='')?`<button class="btn sm ghost" data-act="gp-reset-ex" data-i="${st.i}">Reset this exercise</button>`:''}</div>

  }
  const rest=c.restEnd>Date.now();
  el.innerHTML=`<div class="gp-wrap">
    <div class="gp-top"><button class="icon-btn" data-act="gp-close" aria-label="Close">${I.x}</button><div class="grow" style="min-width:0"><div style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${x.emoji} ${esc(x.title)}</div>${x.home?'':`<div class="gwh-pill">${esc(x.label)}</div>`}<div class="tiny muted"><span id="gp-clock" class="num">${mmss((Date.now()-c.started)/1000)}</span> · step ${c.at+1} of ${steps.length} · ${doneN} done</div></div><button class="icon-btn" data-act="gp-discard" aria-label="Discard workout" title="Discard workout">${I.trash}</button><button class="btn sm primary" data-act="gp-finish">Finish</button></div>

    ${NATIVE&&vidList()[vidKey(it.ex)]?exVideoHTML(it.ex):''}
