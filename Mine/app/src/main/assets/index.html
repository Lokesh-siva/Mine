<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mine</title>
<meta name="theme-color" content="#0A0F0C">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --bg:#0A0F0C; --surface:#111915; --surface2:#17221C; --ink:#E8F1EB; --muted:#9DB0A4; --faint:#66796D; --line:#22302A;
  --accent:#3DDC84; --accent-ink:#04140A; --soft:#15301F; --green:#3DDC84; --green-soft:#143022; --red:#FF6B6B; --red-soft:#3A1F22;
  --amber:#3DDC84; --amber-bg:#3DDC84; --amber-ink:#04140A; --p3:#FF6B6B; --p2:#F5B03A; --p1:#6EA8FF;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
  --display:"Bricolage Grotesque","Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
a{color:var(--accent)}

/* layout */
.rail{display:none}
main{max-width:980px;margin:0 auto;padding:18px 16px 110px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar a,.rail a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:600;padding:4px 8px;border-radius:10px;min-width:56px}
.tabbar a svg,.rail a svg{width:22px;height:22px}
.tabbar a[aria-current="page"],.rail a[aria-current="page"]{color:var(--accent)}
@media (min-width:900px){
  .tabbar{display:none}
  .rail{display:flex;flex-direction:column;gap:4px;position:fixed;top:0;bottom:0;left:0;width:210px;padding:calc(22px + env(safe-area-inset-top,0px)) 14px 20px;border-right:1px solid var(--line);background:var(--surface)}
  .rail .brand{font-family:var(--display);font-weight:800;font-size:1.5rem;padding:0 10px 18px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
  .rail .brand svg{width:34px;height:34px}
  .rail a{flex-direction:row;gap:12px;font-size:14.5px;padding:10px 12px;min-width:0}
  .rail a[aria-current="page"]{background:var(--soft)}
  .rail .spacer{flex:1}
  main{margin-left:210px;padding:28px 32px 60px;max-width:1040px}
  body{padding-left:0}
}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-head h1{font-size:1.9rem;font-weight:800;line-height:1.05}
.page-head .sub{color:var(--muted);font-size:.92rem;margin-top:4px}

/* primitives */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.panel.flush{padding:6px 0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.panel.flush .panel-head{padding:8px 16px 0}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:.85rem} .tiny{font-size:.76rem}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:760px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;font-weight:600;font-size:.9rem;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--red)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;font-size:.82rem;border-radius:8px}
.btn svg{width:16px;height:16px}
.icon-btn{border:0;background:transparent;padding:6px;border-radius:8px;color:var(--muted);display:inline-flex}
.icon-btn:hover{background:var(--surface2);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:600;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip .count{opacity:.7;margin-left:4px;font-weight:500}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 11px;font-weight:600;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.empty{color:var(--muted);text-align:center;padding:22px 10px;font-size:.92rem}
.tag{display:inline-block;font-size:.74rem;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.pos{color:var(--green)} .neg{color:var(--red)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over>i{background:var(--red)}
.divider{height:1px;background:var(--line);margin:10px 0}

/* forms */
label.f{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin:12px 0 5px}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 11px;outline:none}
.in:focus{border-color:var(--accent);background:var(--surface)}
textarea.in{resize:vertical;min-height:64px}
.in.big{font-family:var(--display);font-size:1.8rem;font-weight:700;padding:8px 12px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:8px;font-size:.9rem;margin:8px 0}
.check input{width:18px;height:18px;accent-color:var(--accent)}

/* hero */
.hero{margin:4px 0 20px}
.hero .date{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,9vw,3.6rem);line-height:.95;letter-spacing:-.035em}
.hero .date span{color:var(--accent);font-weight:500}
.hero-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.hero-top .logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:1.2rem}
.hero-top .logo svg{width:30px;height:30px}
@media (min-width:900px){.hero-top{display:none}}
.hero .sub{color:var(--muted);margin-top:8px}
.ledger{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px}
@media (min-width:760px){.ledger{grid-template-columns:repeat(4,1fr)}}
.ledger>div{background:var(--surface);padding:13px 15px}
.ledger .k{font-size:.8rem;color:var(--muted);font-weight:600}
.ledger .v{font-family:var(--display);font-size:1.45rem;font-weight:700;margin-top:2px}
.banner{display:flex;gap:12px;align-items:center;background:var(--amber-bg);color:var(--amber-ink);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-weight:500}
.banner .btn{background:var(--amber-ink);color:var(--accent);border-color:transparent}
.banner svg{width:22px;height:22px;flex:none}
button.banner{width:100%;border:0;text-align:left;font:inherit;cursor:pointer}
button.banner .go{background:var(--amber-ink);color:var(--accent);border-radius:10px;padding:6px 12px;font-weight:700;font-size:.85rem;flex:none}
.smsrow{border-bottom:1px solid var(--line);padding:10px 2px}
.chart{margin-top:8px}
.cplot{position:relative;display:flex;align-items:flex-end;gap:3px;border-bottom:1px solid var(--line)}
.cbar{flex:1;height:100%;display:flex;align-items:flex-end;background:none;border:0;padding:0;min-width:0}
button.cbar{cursor:pointer}
.cbar i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--accent);opacity:.4}
.cbar.on i{opacity:1}
.cline{position:absolute;left:0;right:0;border-top:1px dashed var(--muted);pointer-events:none}
.cline span{position:absolute;right:0;bottom:2px;font-size:10px;color:var(--muted);background:var(--surface);padding:0 4px;border-radius:4px}
.clabels{display:flex;gap:3px;margin-top:4px}
.clabels span{flex:1;min-width:0;text-align:center;font-size:10px;color:var(--muted);white-space:nowrap}
.donutwrap{display:flex;align-items:center;gap:16px;margin:4px 0 10px}
.donut{width:116px;height:116px;border-radius:50%;flex:none;display:grid;place-items:center}
.donut>div{width:78px;height:78px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.2}
.legend{display:grid;gap:5px;font-size:.82rem;min-width:0}
.legend span{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.splitrow{border-top:1px solid var(--line);padding:12px 2px}
.smsmsg{margin-top:6px}.smsmsg summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:600;list-style:none;padding:4px 0}.smsmsg summary::-webkit-details-marker{display:none}
.smsmsg[open] summary{color:var(--muted)}.smsbody{background:var(--soft);border-radius:10px;padding:10px 12px;margin-top:4px}.smsbody p{margin:4px 0 0;font-size:13px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.smsrow:last-child{border-bottom:0}
#review{position:fixed;inset:0;z-index:55;display:none;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
#review.open{display:block}
#review .wrap{max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
#review .top{display:flex;align-items:center;gap:8px;margin-bottom:18px}
#review .eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
#review .range{font-family:var(--display);font-weight:700;font-size:1.15rem;margin-top:4px}
#review .total{font-family:var(--display);font-weight:800;font-size:clamp(3rem,15vw,4.6rem);line-height:1;letter-spacing:-.04em;margin:14px 0 10px}
#review .delta{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:6px 12px;font-weight:700;font-size:.85rem;background:var(--soft);color:var(--accent)}
#review .delta.up{background:var(--red-soft);color:var(--red)}
#review .hero{text-align:center;padding:10px 0 22px}
#review .done{width:100%;padding:14px;font-size:1rem;margin-top:6px}

/* tasks */
.tasks-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.tasks-layout>*,.grid2>*,.matrix>*{min-width:0}
html,body{max-width:100%}
body{overflow-x:clip}
@media (min-width:900px){.tasks-layout{grid-template-columns:200px minmax(0,1fr)}}
.sidelist{display:none}
@media (min-width:900px){
  .sidelist{display:block;align-self:start;position:sticky;top:calc(20px + env(safe-area-inset-top,0px))}
  .tasks-chips{display:none !important}
}
.sidelist button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:transparent;padding:7px 10px;border-radius:8px;font-weight:600;font-size:.9rem;color:var(--muted);text-align:left}
.sidelist button[aria-pressed="true"]{background:var(--soft);color:var(--ink)}
.sidelist .grp{font-size:.76rem;color:var(--faint);font-weight:600;margin:14px 10px 4px}
.sidelist .dot{width:9px;height:9px;border-radius:50%;flex:none}
.sidelist .n{margin-left:auto;font-weight:500;font-size:.8rem}
.quick{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 14px;margin-bottom:6px}
.quick input{flex:1;border:0;background:transparent;outline:none;padding:7px 0;min-width:0}
.quick-hint{font-size:.78rem;color:var(--faint);margin:0 4px 12px;min-height:1.2em}
.quick-hint b{color:var(--accent);font-weight:600}
.group-title{font-size:.8rem;font-weight:700;color:var(--muted);margin:14px 4px 6px;display:flex;gap:6px}
.group-title.over{color:var(--red)}
.trow{display:flex;align-items:flex-start;gap:11px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:6px;cursor:pointer}
.trow:hover{border-color:var(--faint)}
.trow.done .ttl{text-decoration:line-through;color:var(--faint)}
.cb{flex:none;width:21px;height:21px;border-radius:6px;border:2px solid var(--faint);background:transparent;margin-top:1px;display:grid;place-items:center;padding:0}
.cb svg{width:13px;height:13px;opacity:0}
.cb.on{background:var(--faint);border-color:var(--faint)} .cb.on svg{opacity:1;color:var(--surface)}
.cb.p3{border-color:var(--p3)} .cb.p2{border-color:var(--p2)} .cb.p1{border-color:var(--p1)}
.ttl{font-weight:600;word-break:break-word}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.78rem;color:var(--muted);margin-top:2px;align-items:center}
.meta .over{color:var(--red);font-weight:600}
.meta svg{width:12px;height:12px;vertical-align:-1px}
.matrix{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:700px){.matrix{grid-template-columns:1fr 1fr}}
.quad{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:160px}
.quad h3{font-size:.9rem;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.quad h3 i{width:10px;height:10px;border-radius:3px;display:inline-block}
.quad .trow{border-radius:10px;padding:8px 10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:.72rem;font-weight:700;color:var(--faint);text-align:center;padding:4px 0}
.cal .day{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:64px;padding:5px;font-size:.75rem;cursor:pointer;overflow:hidden;text-align:left}
.cal .day.out{opacity:.4}
.cal .day.now{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal .day.sel{background:var(--soft)}
.cal .day .d{font-weight:700;font-size:.8rem}
.cal .day .it{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);margin-top:2px;padding-left:5px;border-left:2px solid var(--line)}
.cal .day .it.p3{border-color:var(--p3)} .cal .day .it.p2{border-color:var(--p2)} .cal .day .it.p1{border-color:var(--p1)}
.focus{text-align:center;padding:26px 10px}
.focus .clock{font-family:var(--display);font-weight:800;font-size:clamp(2.8rem,13vw,4.4rem);line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.focus .ring{width:min(280px,70vw);aspect-ratio:1;margin:0 auto 10px;position:relative;display:grid;place-items:center}
.focus .ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.subtasks .st{display:flex;align-items:center;gap:8px;margin:4px 0}
.subtasks .st input[type=text]{flex:1}

/* habits */
.hrow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.hicon{width:42px;height:42px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-size:1.3rem;flex:none;border:0;padding:0}
.hname{font-weight:700;border:0;background:none;padding:0;text-align:left;cursor:pointer}
.hcheck{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;font-weight:700;font-size:.8rem;position:relative}
.modrow .txicon svg{width:20px;height:20px}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.swatch{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--c);display:grid;place-items:center;color:#04140A;padding:0;cursor:pointer}
.swatch[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg) inset}
.swatch.custom{background:conic-gradient(#FF6B6B,#F5B03A,#3DDC84,#2DD4BF,#6EA8FF,#A78BFA,#F472B6,#FF6B6B);position:relative;overflow:hidden}
.swatch.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.hcheck.on{background:var(--green);border-color:var(--green);color:var(--accent-ink)}
.hcheck svg{width:20px;height:20px}
.week{display:flex;gap:4px;margin-top:6px}
.week button{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:var(--surface2);font-size:.66rem;font-weight:700;color:var(--faint);padding:0}
.week button.on{background:var(--green);border-color:var(--green);color:#fff}
.week button.part{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.week button.off{opacity:.35}
.hcal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.hcal button,.hcal span{aspect-ratio:1;border-radius:9px;border:1px solid var(--line);background:var(--surface2);font-size:.8rem;font-weight:600;color:var(--muted);padding:0}
.hcal span{border:0;background:none;font-size:.7rem;color:var(--faint);display:grid;place-items:center;aspect-ratio:auto;padding:4px 0}
.hcal button.on{background:var(--green);color:#fff;border-color:var(--green)}
.hcal button.part{background:var(--green-soft);color:var(--green);border-color:var(--green)}
.hcal button.off{opacity:.35}
.hcal button.now{box-shadow:inset 0 0 0 2px var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stats>div{background:var(--surface2);border-radius:12px;padding:10px}
.stats .v{font-family:var(--display);font-weight:700;font-size:1.3rem}
.emoji-pick{display:flex;flex-wrap:wrap;gap:4px}
.emoji-pick button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:1.15rem;padding:0}
.emoji-pick button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.daypick{display:flex;gap:4px;flex-wrap:wrap}
.daypick button{width:40px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);font-weight:600;font-size:.8rem}
.daypick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* money */
.accts{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:thin}
.acct{flex:none;min-width:170px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left}
.acct[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.acct .t{font-size:.75rem;color:var(--muted);font-weight:600}
.acct .n{font-weight:700;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct .b{font-family:var(--display);font-weight:700;font-size:1.25rem;margin-top:6px}
.acct.card{background:linear-gradient(135deg,var(--surface),var(--surface2))}
.catrow{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;margin:8px 0;font-size:.88rem}
.txrow{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;border-top:1px solid var(--line)}
.txrow:hover{background:var(--surface2)}
.txicon{width:36px;height:36px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;flex:none;font-size:1rem}
.txamt{font-family:var(--display);font-weight:700;white-space:nowrap}
.datehead{font-size:.78rem;font-weight:700;color:var(--muted);padding:12px 16px 6px;display:flex;justify-content:space-between}
.catpick{display:flex;flex-wrap:wrap;gap:6px}
.catpick button{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:5px 11px;font-size:.83rem;font-weight:600}
.catpick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* carpool */
.prow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-family:var(--display);flex:none}
.owes{font-family:var(--display);font-weight:700;font-size:1.1rem;text-align:right}
.riderpick{display:flex;flex-wrap:wrap;gap:6px}
.riderpick button{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.85rem}
.riderpick button[aria-pressed="true"]{background:var(--green);color:#fff;border-color:var(--green)}
.preview{background:var(--green-soft);color:var(--green);border-radius:10px;padding:10px 12px;font-weight:600;margin-top:12px;font-size:.9rem}

/* modal */
#modal{position:fixed;inset:0;z-index:40;display:none}
#modal.open{display:block}
#modal .scrim{position:absolute;inset:0;background:rgba(8,12,20,.45)}
#modal .sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.2)}
@media (min-width:700px){#modal .sheet{left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%);width:min(560px,94vw);max-height:88vh;border-radius:20px}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.sheet-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.sheet-foot .left{margin-right:auto}

/* alarm */
#alarm{position:fixed;inset:0;z-index:60;display:none;background:var(--amber-bg);color:var(--amber-ink);padding:calc(30px + env(safe-area-inset-top,0px)) 22px calc(30px + env(safe-area-inset-bottom,0px));flex-direction:column;align-items:center;justify-content:center;text-align:center}
#alarm.open{display:flex}
#alarm .bell{width:84px;height:84px;animation:ring 1.2s ease-in-out infinite;transform-origin:50% 10%}
@keyframes ring{0%,50%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%,40%{transform:rotate(-14deg)}}
@media (prefers-reduced-motion:reduce){#alarm .bell{animation:none}}
#alarm .when{font-family:var(--display);font-weight:800;font-size:clamp(3rem,14vw,5.5rem);line-height:1;letter-spacing:-.04em;margin-top:14px}
#alarm .what{font-family:var(--display);font-weight:700;font-size:clamp(1.3rem,5vw,2rem);margin-top:12px;max-width:640px;word-break:break-word}
#alarm .kind{font-weight:600;opacity:.75;margin-top:6px}
#alarm .acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:28px;max-width:520px}
#alarm .acts button{border:2px solid var(--amber-ink);background:transparent;color:var(--amber-ink);border-radius:999px;padding:12px 20px;font-weight:700;font-size:1rem}
#alarm .acts button.main{background:var(--amber-ink);color:var(--amber-bg)}
#alarm .more{margin-top:16px;font-weight:600;opacity:.75}

#toast{position:fixed;border:1px solid var(--accent);left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--surface2);color:var(--ink);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.9rem;display:none;max-width:90vw;box-shadow:var(--shadow)}
#toast.show{display:block}
@media (min-width:900px){#toast{bottom:24px}}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.sync.ok i{background:var(--green)} .sync.err i{background:var(--red)}
.fab{position:fixed;right:18px;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:15;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 24px var(--glow,rgba(61,220,132,.28))}
.fab svg{width:26px;height:26px}
@media (min-width:900px){.fab{bottom:28px;right:28px}}
.hide{display:none !important}
/* app feel */
*{-webkit-tap-highlight-color:transparent}
.sheet-head .back-btn{display:none}
body.kb .tabbar,body.kb .fab{display:none}
body.modal-open{overflow:hidden}
.native body{user-select:none;-webkit-user-select:none}
.native input,.native textarea{user-select:text;-webkit-user-select:text}
.native ::-webkit-scrollbar{display:none}
.native .tabbar{padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.35)}
.native .tabbar a{font-size:12px;gap:4px;min-width:62px;padding:6px 10px;border-radius:14px}
.native .tabbar a svg{width:24px;height:24px}
.native .tabbar a[aria-current="page"]{background:var(--soft)}
.native main{padding-bottom:120px}
.native .fab{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.native .btn,.native .chip,.native .trow,.native .hrow,.native .txrow,.native .acct{transition:transform .08s ease}
.native .btn:active,.native .chip:active,.native .trow:active,.native .hrow:active,.native .txrow:active,.native .acct:active{transform:scale(.98)}
@media (max-width:699px){
  .native #modal .scrim{background:var(--bg)}
  .native #modal .sheet{top:0;bottom:0;max-height:none;height:100%;border-radius:0;box-shadow:none;padding:0 16px calc(24px + env(safe-area-inset-bottom,0px));background:var(--bg)}
  .native .sheet-head{position:sticky;top:0;z-index:2;background:var(--bg);margin:0 -16px 8px;padding:14px 8px 12px;border-bottom:1px solid var(--line);justify-content:flex-start;gap:6px}
  .native .sheet-head .back-btn{display:inline-flex;color:var(--ink)}
  .native .sheet-head .back-btn svg{width:24px;height:24px}
  .native .sheet-head .close-btn{display:none}
  .native .sheet-head h2{font-size:1.2rem}
  .native .sheet-foot{position:sticky;bottom:0;background:var(--bg);margin:18px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
  .native .sheet-foot .btn{padding:11px 16px;font-size:.95rem}
}
@media (min-width:900px){.mobile-only{display:none !important}}
</style>
</head>
<body>
<nav class="rail" id="rail" aria-label="Sections"></nav>
<main id="view"></main>
<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
<div id="modal" role="dialog" aria-modal="true"><div class="scrim" data-act="close-modal"></div><div class="sheet" id="sheet"></div></div>
<div id="alarm" role="alertdialog" aria-live="assertive"></div>
<div id="review" role="dialog" aria-modal="true" aria-label="Expense review"></div>
<div id="toast" role="status"></div>
<script>

/* ================= core ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const todayS=()=>ymd(new Date());
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const inr=(n,dec)=>{const v=Number(n||0);return (v<0?'−':'')+'₹'+Math.abs(v).toLocaleString('en-IN',{minimumFractionDigits:dec?2:0,maximumFractionDigits:2})};
const r2=n=>Math.round(Number(n||0)*100)/100;
function fmtDay(s){
  if(!s) return '';
  const t=new Date(); if(s===ymd(t)) return 'Today';
  if(s===ymd(addDays(t,1))) return 'Tomorrow';
  if(s===ymd(addDays(t,-1))) return 'Yesterday';
  const d=parseYmd(s); const same=d.getFullYear()===t.getFullYear();
  return WD[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]+(same?'':' '+d.getFullYear());
}
function fmtTime(t){ if(!t) return ''; let [h,m]=t.split(':').map(Number); const ap=h>=12?'pm':'am'; h=h%12||12; return h+':'+pad(m)+' '+ap; }
function hhmm(d){return pad(d.getHours())+':'+pad(d.getMinutes())}
function startOfWeek(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const wd=(x.getDay()+6)%7;return addDays(x,-wd)}
function withTimeout(p,ms){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))])}

/* ================= native (Android app) ================= */
const NATIVE=(()=>{try{return !!(window.MineNative&&window.MineNative.isNative())}catch(e){return false}})();
let natT=null;
if(NATIVE) document.documentElement.classList.add('native');
document.addEventListener('focusin',e=>{if(e.target.matches&&e.target.matches('input:not([type=checkbox]):not([type=file]),textarea,select'))document.body.classList.add('kb')});
document.addEventListener('focusout',()=>setTimeout(()=>{const a=document.activeElement;if(!(a&&a.matches&&a.matches('input,textarea,select')))document.body.classList.remove('kb')},50));
function syncNative(){
  if(!NATIVE) return; clearTimeout(natT);
  natT=setTimeout(()=>{try{
    const now=Date.now();
    const list=upcomingAlarms(now+1000,now+14*86400000).slice(0,400).map(a=>({key:a.key,at:a.at.getTime(),title:a.title,body:a.sub||'',kind:a.kind,id:a.id||'',snooze:+S.settings.snooze||10}));
    if(F.running&&F.end>now) list.push({key:'focus@'+F.end,at:F.end,title:F.mode==='focus'?'Focus session done':'Break is over',body:'Focus timer',kind:'focus',id:'',snooze:5});
    window.MineNative.setAlarms(JSON.stringify(list));
  }catch(e){console.warn(e)}},400);
}
function nativeStatus(){try{return JSON.parse(window.MineNative.alarmStatus())}catch(e){return {notif:true,exact:true,fullscreen:true}}}

/* ================= state ================= */
const DEFAULT_EXP=['Food & dining','Groceries','Fuel','Transport','Shopping','Bills & utilities','Rent','EMI & loans','Health','Entertainment','Travel','Personal care','Education','Gifts','Investments','Other'];
const DEFAULT_INC=['Salary','Carpool','Refund','Interest','Freelance','Other income'];
const CAT_ICON={'Food & dining':'🍛','Groceries':'🛒','Fuel':'⛽','Transport':'🚕','Shopping':'🛍️','Bills & utilities':'💡','Rent':'🏠','EMI & loans':'🏦','Health':'💊','Entertainment':'🎬','Travel':'✈️','Personal care':'💈','Education':'📚','Gifts':'🎁','Investments':'📈','Other':'•','Salary':'💼','Carpool':'🚗','Refund':'↩️','Interest':'%','Freelance':'🧑‍💻','Other income':'＋'};
const S={
  settings:{sound:'chime',allDayTime:'09:00',snooze:10,budget:0,theme:'system',accent:'#3DDC84',missedOn:true,missedTime:'09:00',upi:'',focusMin:25,shortMin:5,longMin:15},
  accounts:[], cats:{exp:DEFAULT_EXP.slice(),inc:DEFAULT_INC.slice()}, txns:[],
  lists:[{id:'inbox',name:'Inbox',color:'#2447D6'}], tasks:[], focus:[],
  habits:[], hlog:{},
  people:[], trips:[], pays:[], mcat:{}, rules:[],
  _t:{}
};
const A={fired:{},snoozes:{},soundOn:false}; // device-local alarm bookkeeping
const UI={sel:'all',mode:'list',calMonth:null,calSel:null,monthYM:null,acctFilter:'all',txSearch:'',habitArchived:false};

/* ================= storage & sync ================= */
const LS='daybook.v1', LSA='daybook.alarms.v1';
const Store={db:null,uid:null,timers:{},chain:{},
  saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}},
  loadLocal(){try{const v=JSON.parse(localStorage.getItem(LS)||'null');if(v){Object.assign(S,v);S.settings=Object.assign({},defaultsSettings(),v.settings||{})}}catch(e){}
    try{const a=JSON.parse(localStorage.getItem(LSA)||'null');if(a){A.fired=a.fired||{};A.snoozes=a.snoozes||{}}}catch(e){}},
  saveAlarms(){try{localStorage.setItem(LSA,JSON.stringify({fired:A.fired,snoozes:A.snoozes}))}catch(e){}},
  docData(n){
    if(n==='settings') return {settings:S.settings};
    if(n==='money') return {accounts:S.accounts,cats:S.cats,rules:S.rules||[],mcat:S.mcat||{},months:[...new Set(S.txns.map(t=>t.date.slice(0,7)))]};
    if(n==='tasks') return {lists:S.lists,tasks:S.tasks,focus:S.focus.slice(-400)};
    if(n==='habits') return {habits:S.habits,hlog:S.hlog};
    if(n==='carpool') return {people:S.people,trips:S.trips,pays:S.pays};
    if(n.startsWith('txn_')) {const m=n.slice(4);return {txns:S.txns.filter(t=>t.date.slice(0,7)===m)}}
  },
  mark(...names){
    const now=Date.now();
    names.forEach(n=>{S._t[n]=now});
    this.saveLocal(); syncNative();
    if(!this.db) return;
    names.forEach(n=>{clearTimeout(this.timers[n]);this.timers[n]=setTimeout(()=>this.push(n),600)});
  },
  push(n){
    if(!this.db) return;
    const data=this.docData(n); data._t=S._t[n]||Date.now();
    const ref=this.db.doc('data/users/'+this.uid+'/'+n);
    setSync('syncing');
    this.chain[n]=(this.chain[n]||Promise.resolve()).then(()=>ref.set(JSON.parse(JSON.stringify(data)))).then(()=>setSync('ok')).catch(e=>{console.warn('sync',n,e);setSync('err')});
  }
};
function defaultsSettings(){return {sound:'chime',allDayTime:'09:00',snooze:10,budget:0,theme:'system',accent:'#3DDC84',missedOn:true,missedTime:'09:00',upi:'',focusMin:25,shortMin:5,longMin:15}}
function applyDoc(n,d){
  if(n==='settings') S.settings=Object.assign(defaultsSettings(),d.settings||{});
  else if(n==='money'){S.accounts=d.accounts||[];S.cats=d.cats||S.cats;S.rules=d.rules||S.rules||[];S.mcat=d.mcat||S.mcat||{}}
  else if(n==='tasks'){S.lists=(d.lists&&d.lists.length)?d.lists:S.lists;S.tasks=d.tasks||[];S.focus=d.focus||[]}
  else if(n==='habits'){S.habits=d.habits||[];S.hlog=d.hlog||{}}
  else if(n==='carpool'){S.people=d.people||[];S.trips=d.trips||[];S.pays=d.pays||[]}
}
let syncState='local';
function setSync(s){syncState=s;$$('.sync').forEach(el=>{el.className='sync '+(s==='ok'?'ok':s==='err'?'err':'');el.innerHTML='<i></i>'+syncLabel()})}
function syncLabel(){if(NATIVE)return 'Saved on this phone';return syncState==='ok'?'Synced to your account':syncState==='syncing'?'Syncing…':syncState==='err'?'Sync failed, saved on this device':'Saved on this device'}
async function connect(){
  try{
    if(!window.claude||typeof window.claude.use!=='function') return setSync('local');
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user) return setSync('local');
    const id=await user.id(); if(!id) return setSync('local');
    Store.db=db; Store.uid=id; setSync('syncing');
    const base='data/users/'+id+'/';
    const get=n=>withTimeout(db.doc(base+n).get(),12000).then(s=>s.exists?s.data():null).catch(()=>undefined);
    const names=['settings','money','tasks','habits','carpool'];
    const remote=await Promise.all(names.map(get));
    let failed=false;
    names.forEach((n,i)=>{
      const r=remote[i]; if(r===undefined){failed=true;return}
      const lt=S._t[n]||0;
      if(r && (r._t||0)>=lt){applyDoc(n,r);S._t[n]=r._t||0}
      else if(lt>0) Store.push(n);
    });
    // transaction months
    const rm=remote[1]&&remote[1].months||[];
    const lm=[...new Set(S.txns.map(t=>t.date.slice(0,7)))];
    const months=[...new Set([...rm,...lm])];
    const mr=await Promise.all(months.map(m=>get('txn_'+m)));
    months.forEach((m,i)=>{
      const r=mr[i],k='txn_'+m; if(r===undefined){failed=true;return}
      const lt=S._t[k]||0;
      if(r && (r._t||0)>=lt){S.txns=S.txns.filter(t=>t.date.slice(0,7)!==m).concat(r.txns||[]);S._t[k]=r._t||0}
      else if(lt>0) Store.push(k);
    });
    Store.saveLocal(); setSync(failed?'err':'ok'); applyTheme(); render();
  }catch(e){console.warn(e);setSync('local')}
}

/* ================= icons ================= */
const ic=(p,extra='')=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${p}</svg>`;
const I={
  today:ic('<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/><circle cx="12" cy="15" r="2"/>'),
  tasks:ic('<path d="M9 6h11M9 12h11M9 18h11"/><path d="m3 6 1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/>'),
  habits:ic('<path d="M12 3c2 4 6 5 6 10a6 6 0 0 1-12 0c0-3 2-4 2-7 2 1 3 3 3 5 1-2 1-5 1-8z"/>'),
  money:ic('<rect x="2" y="6" width="20" height="13" rx="2.5"/><path d="M2 10h20M6 15h4"/>'),
  car:ic('<path d="M5 17h14M3 13l2-6a2 2 0 0 1 2-1.4h10A2 2 0 0 1 19 7l2 6v4a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H6v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><circle cx="7.5" cy="13.5" r=".6"/><circle cx="16.5" cy="13.5" r=".6"/>'),
  gear:ic('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
  plus:ic('<path d="M12 5v14M5 12h14"/>'),
  check:ic('<path d="m5 12 5 5L20 7"/>','stroke-width="3"'),
  bell:ic('<path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>'),
  repeat:ic('<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>'),
  clock:ic('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
  x:ic('<path d="M18 6 6 18M6 6l12 12"/>'),
  trash:ic('<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>'),
  left:ic('<path d="m15 18-6-6 6-6"/>'), right:ic('<path d="m9 18 6-6-6-6"/>'),
  list:ic('<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>'),
  sub:ic('<path d="M4 4v10a4 4 0 0 0 4 4h12M16 14l4 4-4 4"/>'),
  wa:ic('<path d="M3 21l1.6-4.7A8.5 8.5 0 1 1 8 19.6z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 .8a4 4 0 0 1-1.8-1.8l.8-1-1-2z"/>'),
  download:ic('<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>'),
  cal:ic('<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/>'),
  play:ic('<path d="M7 4v16l13-8z"/>'), pause:ic('<path d="M7 4h3v16H7zM14 4h3v16h-3z"/>'),
  edit:ic('<path d="M4 20h4L19 9l-4-4L4 16z"/>'),

const ROUTES=[['today','Today',I.today],['tasks','Tasks',I.tasks],['habits','Habits',I.habits],['money','Money',I.money],['carpool','Carpool',I.car]];
// Modules in the user's order; switched-off ones are hidden but keep their data
function modOrder(){const o=(S.settings.modOrder||[]).filter(k=>ROUTES.some(r=>r[0]===k));ROUTES.forEach(r=>{if(!o.includes(r[0]))o.push(r[0])});return o}
const modOn=k=>!(S.settings.modOff||[]).includes(k);
const modules=()=>modOrder().filter(modOn).map(k=>ROUTES.find(r=>r[0]===k));
function route(){const h=(location.hash||'').replace('#',''),m=modules();if(h==='prefs'||(m.some(r=>r[0]===h)))return h;return m.length?m[0][0]:'prefs'}

  const mods=modules();

  // Settings lives behind the gear on Today, so it gets a tab when Today is off
  $('#tabbar').innerHTML=(modOn('today')?mods:mods.concat([['prefs','Settings',I.gear]])).map(link).join('');
  setSync(syncState);
}
function render(){

}
let widgetLast='';
function syncWidget(){
  if(!NATIVE) return;
  const n=todayS(), amt=inr(monthTx(n.slice(0,7)).filter(t=>t.type==='expense').reduce((a,t)=>a+ +t.amount,0));
  const label=MON[+n.slice(5,7)-1].toUpperCase()+' SPENT';
  if(label+amt===widgetLast) return; widgetLast=label+amt;
  try{window.MineNative.setWidget(label,amt)}catch(e){}
}
let watchLast='';
function syncWatch(){
  if(!NATIVE) return;
  let from=ymd(addDays(new Date(),-40)); const sf=smsFrom(); if(sf<from) from=ymd(addDays(parseYmd(sf),-2));
  const idx=JSON.stringify(S.txns.filter(t=>t.type==='expense'&&t.date>=from).map(t=>({d:t.date,a:+t.amount,s:t.smsId||''})));
  if(idx===watchLast) return; watchLast=idx;
  try{window.MineNative.setExpenseIndex(idx)}catch(e){}
}
const ACCENTS=[['#3DDC84','Green'],['#2DD4BF','Teal'],['#38BDF8','Sky'],['#6EA8FF','Blue'],['#A78BFA','Violet'],['#F472B6','Pink'],['#FF6B6B','Coral'],['#FB923C','Orange'],['#F5B03A','Amber'],['#E8F1EB','Mono']];
function hexRgb(h){h=String(h||'').replace('#','');if(h.length===3)h=h.replace(/./g,'$&$&');const n=parseInt(h,16);return /^[0-9a-f]{6}$/i.test(h)?[n>>16&255,n>>8&255,n&255]:null}
const inkOf=h=>{const c=hexRgb(h)||[0,0,0];return (.2126*c[0]+.7152*c[1]+.0722*c[2])>140?'#04140A':'#FFFFFF'};

const PRIO=[{v:0,l:'None'},{v:1,l:'Low'},{v:2,l:'Medium'},{v:3,l:'High'}];
const REM_OPTS=[[0,'At time of task'],[5,'5 min before'],[15,'15 min before'],[30,'30 min before'],[60,'1 hour before'],[1440,'1 day before']];
const REPEATS=[['','Does not repeat'],['daily','Every day'],['weekdays','Every weekday (Mon–Fri)'],['weekly','Every week'],['monthly','Every month'],['yearly','Every year'],['custom','Every N days']];
const listById=id=>S.lists.find(l=>l.id===id)||S.lists[0];
function nextDate(s,rep){
  const d=parseYmd(s);
  if(rep.freq==='daily') return ymd(addDays(d,1));
  if(rep.freq==='custom') return ymd(addDays(d,Math.max(1,+rep.interval||1)));
  if(rep.freq==='weekly') return ymd(addDays(d,7));
  if(rep.freq==='weekdays'){let x=addDays(d,1);while(x.getDay()===0||x.getDay()===6)x=addDays(x,1);return ymd(x)}
  if(rep.freq==='monthly'){const day=d.getDate();const x=new Date(d.getFullYear(),d.getMonth()+1,1);const last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(Math.min(day,last));return ymd(x)}
  if(rep.freq==='yearly'){return ymd(new Date(d.getFullYear()+1,d.getMonth(),d.getDate()))}
  return s;
}
function repLabel(rep){if(!rep||!rep.freq)return '';if(rep.freq==='custom')return 'Every '+rep.interval+' days';return (REPEATS.find(r=>r[0]===rep.freq)||[,''])[1]}
function taskBase(t){if(!t.due)return null;const d=parseYmd(t.due);const [h,m]=(t.time||S.settings.allDayTime||'09:00').split(':').map(Number);d.setHours(h,m,0,0);return d}
function isOver(t){if(t.done||!t.due)return false;const n=todayS();if(t.due<n)return true;if(t.due===n&&t.time){return taskBase(t)<new Date()}return false}
function toggleTask(id){
  const t=S.tasks.find(x=>x.id===id); if(!t) return;
  if(!t.done && t.repeat && t.repeat.freq && t.due){
    // record a completed copy, then roll the task forward
    S.tasks.push(Object.assign(JSON.parse(JSON.stringify(t)),{id:uid(),done:true,doneAt:Date.now(),repeat:null,fromRepeat:true,rem:[]}));
    t.due=nextDate(t.due,t.repeat); t.subs=(t.subs||[]).map(s=>Object.assign(s,{done:false})); delete t.snooze; t.remSet=Date.now();
    toast('Done. Next: '+fmtDay(t.due)+(t.time?' '+fmtTime(t.time):''));
  } else {
    t.done=!t.done; t.doneAt=t.done?Date.now():null; if(t.done) delete t.snooze;
  }
  Store.mark('tasks'); render();
}
function selTasks(sel){
  const n=todayS(), wk=ymd(addDays(new Date(),6)), tm=ymd(addDays(new Date(),1));
  const open=S.tasks.filter(t=>!t.done);
  if(sel==='today') return open.filter(t=>t.due&&t.due<=n);
  if(sel==='tomorrow') return open.filter(t=>t.due===tm);
  if(sel==='week') return open.filter(t=>t.due&&t.due<=wk);
  if(sel==='inbox') return open.filter(t=>t.list==='inbox');
  if(sel==='all') return open;
  if(sel==='nodate') return open.filter(t=>!t.due);
  if(sel==='done') return S.tasks.filter(t=>t.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  if(sel.startsWith('list:')) return open.filter(t=>t.list===sel.slice(5));
  if(sel.startsWith('tag:')) return open.filter(t=>(t.tags||[]).includes(sel.slice(4)));
  return open;
}
const sortTasks=a=>a.sort((x,y)=>{const dx=x.due||'9999',dy=y.due||'9999';if(dx!==dy)return dx<dy?-1:1;const tx=x.time||'99',ty=y.time||'99';if(tx!==ty)return tx<ty?-1:1;return (y.prio||0)-(x.prio||0)});
function selName(sel){return {today:'Today',tomorrow:'Tomorrow',week:'Next 7 days',inbox:'Inbox',all:'All tasks',nodate:'No date',done:'Completed'}[sel]||(sel.startsWith('list:')?listById(sel.slice(5)).name:sel.startsWith('tag:')?'#'+sel.slice(4):'Tasks')}
function allTags(){return [...new Set(S.tasks.filter(t=>!t.done).flatMap(t=>t.tags||[]))].sort()}

function taskRow(t,opts={}){

  if(t.due&&(t.rem||[]).length&&!t.done) meta.push(`<span title="Reminder set">${I.bell}</span>`);
  if((t.subs||[]).length){const d=t.subs.filter(s=>s.done).length;meta.push(`<span>${I.sub} ${d}/${t.subs.length}</span>`)}
  if(!opts.noList&&t.list!=='inbox') meta.push(`<span>${esc(listById(t.list).name)}</span>`);
  (t.tags||[]).forEach(g=>meta.push(`<span class="tag">#${esc(g)}</span>`));

    <div class="grow"><div class="ttl">${esc(t.title)}</div>${meta.length?`<div class="meta">${meta.join('')}</div>`:''}</div></div>`;

/* quick add parser: "Pay rent tomorrow 9am !high #bills ~Home every month" */
function parseQuick(raw){
  let s=' '+raw+' ', out={title:'',due:null,time:null,prio:0,tags:[],list:null,repeat:null};
  const now=new Date();
  const take=(re,fn)=>{s=s.replace(re,(...m)=>{fn(m);return ' '})};
  take(/\s!(high|h|3)\b/i,()=>out.prio=3); take(/\s!(medium|med|m|2)\b/i,()=>out.prio=2); take(/\s!(low|l|1)\b/i,()=>out.prio=1);
  take(/\s#([\w-]+)/g,m=>out.tags.push(m[1].toLowerCase()));
  take(/\s~([\w-]+)/,m=>{const l=S.lists.find(x=>x.name.toLowerCase()===m[1].toLowerCase());if(l)out.list=l.id});
  take(/\s(every\s?day|daily)\b/i,()=>out.repeat={freq:'daily'});
  take(/\s(every\s?weekday|weekdays)\b/i,()=>out.repeat={freq:'weekdays'});
  take(/\s(every\s?week|weekly)\b/i,()=>out.repeat={freq:'weekly'});
  take(/\s(every\s?month|monthly)\b/i,()=>out.repeat={freq:'monthly'});
  take(/\s(every\s?year|yearly)\b/i,()=>out.repeat={freq:'yearly'});
  take(/\severy\s(\d+)\s?days?\b/i,m=>out.repeat={freq:'custom',interval:+m[1]});
  take(/\sin\s(\d+)\s?(min|mins|minutes|m|hours|hour|hrs|hr|h)\b/i,m=>{const ms=/^h/i.test(m[2])?m[1]*3600000:m[1]*60000;const d=new Date(Date.now()+ms);out.due=ymd(d);out.time=hhmm(d)});
  take(/\s(?:at\s)?(\d{1,2})(?::(\d{2}))?\s?(am|pm)\b/i,m=>{let h=+m[1]%12;if(m[3].toLowerCase()==='pm')h+=12;out.time=pad(h)+':'+pad(+(m[2]||0))});
  take(/\s(?:at\s)?([01]?\d|2[0-3]):([0-5]\d)\b/,m=>out.time=pad(+m[1])+':'+m[2]);
  take(/\s(today|tonight)\b/i,m=>{out.due=todayS();if(m[1].toLowerCase()==='tonight'&&!out.time)out.time='20:00'});
  take(/\s(tomorrow|tmrw|tmr)\b/i,()=>out.due=ymd(addDays(now,1)));
  take(/\s(day after tomorrow)\b/i,()=>out.due=ymd(addDays(now,2)));
  take(/\s(next week)\b/i,()=>out.due=ymd(addDays(startOfWeek(now),7)));
  take(/\s(?:on\s|next\s)?(sun|mon|tue|tues|wed|thu|thur|thurs|fri|sat)(?:day|nesday|urday|sday)?\b/i,m=>{const k=m[1].slice(0,3).toLowerCase();const w=['sun','mon','tue','wed','thu','fri','sat'].indexOf(k);let d=addDays(now,1);while(d.getDay()!==w)d=addDays(d,1);out.due=ymd(d)});
  take(/\s(\d{1,2})\s?(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\b/i,m=>{const mo=MON.findIndex(x=>x.toLowerCase()===m[2].toLowerCase());let d=new Date(now.getFullYear(),mo,+m[1]);if(ymd(d)<todayS())d=new Date(now.getFullYear()+1,mo,+m[1]);out.due=ymd(d)});
  take(/\s(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/,m=>{let y=m[3]?+m[3]:now.getFullYear();if(y<100)y+=2000;const d=new Date(y,+m[2]-1,+m[1]);out.due=ymd(d)});
  if(out.time&&!out.due){out.due=todayS();if(taskBase(out)<new Date())out.due=ymd(addDays(now,1))}
  if(out.repeat&&!out.due) out.due=todayS();
  out.title=s.replace(/\s+/g,' ').trim();
  return out;
}
function quickHint(raw){
  if(!raw.trim()) return 'Try: <b>Pay rent tomorrow 9am !high #bills every month</b>';
  const p=parseQuick(raw), bits=[];
  if(p.due) bits.push('<b>'+fmtDay(p.due)+(p.time?' '+fmtTime(p.time):'')+'</b>');
  if(p.repeat) bits.push('<b>'+repLabel(p.repeat)+'</b>');
  if(p.prio) bits.push('<b>'+PRIO[p.prio].l+' priority</b>');
  if(p.tags.length) bits.push('<b>'+p.tags.map(t=>'#'+t).join(' ')+'</b>');
  if(p.list) bits.push('<b>'+esc(listById(p.list).name)+'</b>');
  return bits.length?'Will add: '+bits.join(', ')+(p.time?' with an alarm':''):'Press Enter to add';
}
function addQuick(raw,defDue){
  if(!raw.trim()) return;
  const p=parseQuick(raw); if(!p.title) return;
  let list=p.list||(UI.sel.startsWith('list:')?UI.sel.slice(5):'inbox');
  let due=p.due||defDue||null; if(!due&&!defDue&&(UI.sel==='today'||UI.sel==='week')) due=todayS(); if(!due&&UI.sel==='tomorrow') due=ymd(addDays(new Date(),1));
  const tags=p.tags.slice(); if(UI.sel.startsWith('tag:')&&!tags.includes(UI.sel.slice(4))) tags.push(UI.sel.slice(4));
  const t={id:uid(),title:p.title,notes:'',list,prio:p.prio,due,time:p.time,rem:due?[0]:[],repeat:p.repeat,tags,subs:[],done:false,created:Date.now(),remSet:Date.now()};
  S.tasks.push(t); Store.mark('tasks'); render();
  toast('Added'+(t.due?' for '+fmtDay(t.due)+(t.time?' '+fmtTime(t.time):''):''));
}

function viewTasks(){
  if(UI.mode!=='calendar') UI.mode='list';

      const used=new Set();
      groups.forEach(([g,f,cls])=>{const gi=items.filter(t=>!used.has(t.id)&&f(t));gi.forEach(t=>used.add(t.id));if(gi.length) list+=`<div class="group-title ${cls||''}">${g} <span class="faint">${gi.length}</span></div>`+gi.map(t=>taskRow(t)).join('')});

function calendarView(){
  const now=new Date(); if(!UI.calMonth) UI.calMonth=ymd(new Date(now.getFullYear(),now.getMonth(),1));
  const m0=parseYmd(UI.calMonth), start=startOfWeek(m0), n=todayS(); if(!UI.calSel) UI.calSel=n;
  let cells='';
  for(let i=0;i<42;i++){
    const d=addDays(start,i), s=ymd(d); if(i>=35&&d.getMonth()!==m0.getMonth()) break;
    const its=sortTasks(S.tasks.filter(t=>t.due===s&&!t.done));
    cells+=`<button class="day ${d.getMonth()!==m0.getMonth()?'out':''} ${s===n?'now':''} ${s===UI.calSel?'sel':''}" data-act="cal-day" data-v="${s}"><div class="d">${d.getDate()}</div>${its.slice(0,3).map(t=>`<div class="it p${t.prio||0}">${t.time?fmtTime(t.time).replace(':00','')+' ':''}${esc(t.title)}</div>`).join('')}${its.length>3?`<div class="faint">+${its.length-3}</div>`:''}</button>`;
  }
  const dayItems=sortTasks(S.tasks.filter(t=>t.due===UI.calSel));
  return `<div class="row" style="justify-content:space-between;margin-bottom:10px"><button class="icon-btn" data-act="cal-nav" data-v="-1" aria-label="Previous month">${I.left}</button><h2>${MONL[m0.getMonth()]} ${m0.getFullYear()}</h2><button class="icon-btn" data-act="cal-nav" data-v="1" aria-label="Next month">${I.right}</button></div>
  <div class="cal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(w=>`<div class="wd">${w}</div>`).join('')}${cells}</div>
  <div class="group-title" style="margin-top:18px">${fmtDay(UI.calSel)}</div>
  <div class="quick"><input id="quick" data-date="${UI.calSel}" placeholder="Add a task on ${fmtDay(UI.calSel)}" autocomplete="off" aria-label="Add a task on this day"><button class="btn primary sm" data-act="quick-add">Add</button></div><div class="quick-hint" id="quick-hint"></div>
  ${dayItems.map(t=>taskRow(t)).join('')||'<div class="empty">No tasks on this day.</div>'}`;
}

/* focus / pomodoro */
const F={mode:'focus',end:null,remaining:null,running:false,taskId:'',timer:null,count:0};
function fDur(m){return (m==='focus'?S.settings.focusMin:m==='short'?S.settings.shortMin:S.settings.longMin)*60000}
function fLeft(){if(F.running)return Math.max(0,F.end-Date.now());return F.remaining??fDur(F.mode)}
function focusView(){
  const left=fLeft(), tot=fDur(F.mode), mm=Math.floor(left/60000), ss=Math.floor(left%60000/1000);
  const frac=1-left/tot, C=2*Math.PI*46;
  const todayMin=S.focus.filter(f=>f.date===todayS()).reduce((a,f)=>a+f.min,0);
  const open=sortTasks(selTasks('all')).slice(0,60);
  return `<div class="panel focus">
    <div class="seg" style="margin-bottom:20px">${[['focus','Focus'],['short','Short break'],['long','Long break']].map(([k,l])=>`<button data-act="f-mode" data-v="${k}" aria-pressed="${F.mode===k}">${l}</button>`).join('')}</div>
    <div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="var(--line)" stroke-width="4"/><circle id="f-arc" cx="50" cy="50" r="46" fill="none" stroke="${F.mode==='focus'?'var(--accent)':'var(--green)'}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}"/></svg><div class="clock" id="f-clock">${pad(mm)}:${pad(ss)}</div></div>
    <div style="max-width:360px;margin:0 auto 16px"><select class="in" id="f-task" aria-label="Task to focus on"><option value="">No task selected</option>${open.map(t=>`<option value="${t.id}" ${F.taskId===t.id?'selected':''}>${esc(t.title)}</option>`).join('')}</select></div>
    <div class="row" style="justify-content:center"><button class="btn primary" data-act="f-toggle" style="min-width:130px">${F.running?I.pause+' Pause':I.play+' Start'}</button><button class="btn" data-act="f-reset">Reset</button></div>
    <p class="muted small" style="margin-top:18px">Today: <b class="num">${todayMin} min</b> focused across ${S.focus.filter(f=>f.date===todayS()).length} sessions. An alarm rings when the timer ends.</p>
  </div>`;
}
function tickFocus(){
  clearInterval(F.timer);
  if(!F.running) return;
  F.timer=setInterval(()=>{
    const left=fLeft();
    const el=$('#f-clock'); if(el){el.textContent=pad(Math.floor(left/60000))+':'+pad(Math.floor(left%60000/1000));const arc=$('#f-arc');if(arc){const C=2*Math.PI*46;arc.setAttribute('stroke-dashoffset',C*(left/fDur(F.mode)))}}
    if(left<=0){
      clearInterval(F.timer); F.running=false; F.remaining=null;
      if(F.mode==='focus'){S.focus.push({date:todayS(),min:S.settings.focusMin,task:F.taskId||null});Store.mark('tasks');F.count++}
      const was=F.mode; F.mode=was==='focus'?(F.count%4===0?'long':'short'):'focus';
      const t=F.taskId&&S.tasks.find(x=>x.id===F.taskId);
      raiseAlarm({key:'focus@'+Date.now(),kind:'focus',title:was==='focus'?'Focus session done'+(t?': '+t.title:''):'Break is over',sub:was==='focus'?'Time for a '+(F.mode==='long'?'long':'short')+' break':'Back to focus',at:new Date()});
      if(route()==='tasks'&&UI.mode==='focus') render();
    }
  },500);
}

/* calendar export */
function icsDate(d){return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00'}
function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/[,;]/g,m=>'\\'+m)}
function rrule(rep){if(!rep||!rep.freq)return null;return {daily:'FREQ=DAILY',weekdays:'FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR',weekly:'FREQ=WEEKLY',monthly:'FREQ=MONTHLY',yearly:'FREQ=YEARLY',custom:'FREQ=DAILY;INTERVAL='+(rep.interval||2)}[rep.freq]}
function buildIcs(items){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Mine//EN','CALSCALE:GREGORIAN'];
  const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  items.forEach(it=>{
    L.push('BEGIN:VEVENT','UID:'+it.uid+'@mine','DTSTAMP:'+stamp);
    if(it.allDay){L.push('DTSTART;VALUE=DATE:'+it.date.replace(/-/g,''),'DTEND;VALUE=DATE:'+ymd(addDays(parseYmd(it.date),1)).replace(/-/g,''))}
    else {L.push('DTSTART:'+icsDate(it.start),'DTEND:'+icsDate(new Date(it.start.getTime()+30*60000)))}
    L.push('SUMMARY:'+icsEsc(it.title)); if(it.notes) L.push('DESCRIPTION:'+icsEsc(it.notes));
    if(it.rrule) L.push('RRULE:'+it.rrule);
    (it.alarms||[]).forEach(tr=>L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(it.title),'TRIGGER:'+tr,'END:VALARM'));
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR'); return L.join('\r\n');
}
function taskIcsItem(t){
  const allDay=!t.time; const it={uid:t.id,title:t.title,notes:t.notes,rrule:rrule(t.repeat),allDay,date:t.due,start:taskBase(t)};
  const rem=(t.rem&&t.rem.length)?t.rem:[0];
  it.alarms=allDay?[(()=>{const [h,m]=S.settings.allDayTime.split(':').map(Number);return 'PT'+h+'H'+m+'M'})()]:rem.map(m=>m?'-PT'+m+'M':'PT0M');
  return it;
}
function gcalLink(t){
  const s=taskBase(t); let dates;
  if(!t.time){dates=t.due.replace(/-/g,'')+'/'+ymd(addDays(parseYmd(t.due),1)).replace(/-/g,'')}
  else dates=icsDate(s)+'/'+icsDate(new Date(s.getTime()+30*60000));
  let u='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(t.title)+'&dates='+dates+'&details='+encodeURIComponent(t.notes||'Added from Mine');
  const rr=rrule(t.repeat); if(rr) u+='&recur='+encodeURIComponent('RRULE:'+rr);
  return u;
}
async function saveFile(filename,data){
  if(NATIVE){try{toast(window.MineNative.saveFile(filename,String(data)))}catch(e){toast('Could not save the file')}return}
  try{
    const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(dl){await dl.save({filename,data});toast('Saved '+filename);return}
  }catch(e){if(e&&e.code&&e.code!=='unavailable'){toast('Not saved');return}}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=filename;document.body.appendChild(a);a.click();a.remove()}catch(e){toast('Downloads aren’t available here')}
}

const EMOJI=['💧','🏃','⚽','🧘','📖','💪','🥗','😴','🦷','💊','🚶','🚴','🧠','✍️','🎸','🌅','🚭','☕','📵','🙏','🧹','💰','🍎','🧴'];
const SECTIONS=[['morning','Morning'],['afternoon','Afternoon'],['evening','Evening'],['any','Anytime']];
const hlog=(h,s)=>((S.hlog[h.id]||{})[s]||0);
function scheduled(h,d){
  const s=ymd(d); if(h.start&&s<h.start) return false;
  if(h.freq==='days') return (h.days||[]).includes(d.getDay());
  return true;
}
function doneOn(h,s){return hlog(h,s)>=(h.goal||1)}
function weekCount(h,ws){let c=0;for(let i=0;i<7;i++)if(doneOn(h,ymd(addDays(ws,i))))c++;return c}
function streaks(h){
  const now=new Date();
  if(h.freq==='weekly'){
    const need=h.perWeek||3; let cur=0, wk=startOfWeek(now);
    if(weekCount(h,wk)>=need) cur++; wk=addDays(wk,-7);
    while(weekCount(h,wk)>=need&&cur<600){cur++;wk=addDays(wk,-7)}
    // best
    const first=firstLog(h); let best=0,run=0;
    if(first){let w=startOfWeek(first);while(w<=now){if(weekCount(h,w)>=need){run++;best=Math.max(best,run)}else if(w<startOfWeek(now))run=0;w=addDays(w,7)}}
    return {cur,best:Math.max(best,cur),unit:'week'};
  }
  let d=new Date(now.getFullYear(),now.getMonth(),now.getDate()), cur=0, guard=0;
  if(!doneOn(h,ymd(d))) d=addDays(d,-1);
  while(guard++<2000){ if(h.start&&ymd(d)<h.start) break; if(!scheduled(h,d)){d=addDays(d,-1);continue} if(doneOn(h,ymd(d))){cur++;d=addDays(d,-1)}else break; }
  const first=firstLog(h); let best=0,run=0;
  if(first){let x=first;while(ymd(x)<=ymd(now)){if(scheduled(h,x)){if(doneOn(h,ymd(x))){run++;best=Math.max(best,run)}else if(ymd(x)<ymd(now))run=0}x=addDays(x,1)}}
  return {cur,best:Math.max(best,cur),unit:'day'};
}
function firstLog(h){const k=Object.keys(S.hlog[h.id]||{}).sort()[0];return k?parseYmd(k):null}
function monthRate(h,ym){
  const [y,m]=ym.split('-').map(Number); const last=new Date(y,m,0).getDate(); const n=todayS(); let sched=0,done=0;
  for(let i=1;i<=last;i++){const d=new Date(y,m-1,i),s=ymd(d);if(s>n)break;if(h.freq==='weekly'){if(doneOn(h,s))done++;continue}if(scheduled(h,d)){sched++;if(doneOn(h,s))done++}}
  if(h.freq==='weekly'){const weeks=Math.max(1,Math.ceil(Math.min(last,new Date().getMonth()+1===m&&new Date().getFullYear()===y?new Date().getDate():last)/7));return Math.min(100,Math.round(done/(weeks*(h.perWeek||3))*100))}
  return sched?Math.round(done/sched*100):0;
}
function checkHabit(id,s,mode){
  const h=S.habits.find(x=>x.id===id); if(!h) return;
  S.hlog[id]=S.hlog[id]||{}; const cur=S.hlog[id][s]||0, goal=h.goal||1;
  let v;
  if(mode==='toggle') v=cur>=goal?0:goal;
  else v=cur>=goal?0:cur+1; // increment, wrap to 0 after goal
  if(v) S.hlog[id][s]=v; else delete S.hlog[id][s];
  Store.mark('habits');
  if(v>=goal&&cur<goal&&s===todayS()){const st=streaks(h);toast(h.icon+' '+h.name+' done'+(st.cur>1?' · '+st.cur+' '+st.unit+' streak':''))}
  render();
}
function freqLabel(h){
  if(h.freq==='days') return (h.days||[]).slice().sort().map(d=>WD[d]).join(', ');
  if(h.freq==='weekly') return (h.perWeek||3)+' times a week';
  return 'Every day';
}
function habitRow(h,compact){
  const n=todayS(), v=hlog(h,n), goal=h.goal||1, on=v>=goal, st=streaks(h), sch=scheduled(h,new Date())||h.freq==='weekly';
  const ws=startOfWeek(new Date());
  const week=compact?'':`<div class="week">${[0,1,2,3,4,5,6].map(i=>{const d=addDays(ws,i),s=ymd(d),c=hlog(h,s),fut=s>n;return `<button data-act="h-day" data-id="${h.id}" data-v="${s}" class="${c>=goal?'on':c>0?'part':''} ${(!scheduled(h,d)&&h.freq!=='weekly')||fut?'off':''}" ${fut?'disabled':''} aria-label="${WD[d.getDay()]} ${c>=goal?'done':'not done'}">${'MTWTFSS'[i]}</button>`}).join('')}</div>`;
  const prog=goal>1?`<span class="num">${v}/${goal}${h.unit?' '+esc(h.unit):''}</span>`:'';
  const wk=h.freq==='weekly'?`<span class="num">${weekCount(h,ws)}/${h.perWeek||3} this week</span>`:'';
  return `<div class="hrow">
    <button class="hicon" data-act="h-open" data-id="${h.id}" aria-label="Open ${esc(h.name)}">${esc(h.icon||'✓')}</button>
    <div class="grow"><button class="hname" data-act="h-open" data-id="${h.id}">${esc(h.name)}</button>
      <div class="meta">${prog}${wk}${st.cur?`<span>🔥 <span class="num">${st.cur}</span> ${st.unit}${st.cur>1?'s':''}</span>`:''}${(h.rem||[]).length?`<span>${I.bell} ${h.rem.map(fmtTime).join(', ')}</span>`:''}${!sch?'<span>Not scheduled today</span>':''}</div>${week}</div>
    <button class="hcheck ${on?'on':''}" data-act="h-check" data-id="${h.id}" aria-label="${on?'Undo':'Check in'} ${esc(h.name)}" title="${goal>1?'Tap to add 1':'Tap to check in'}">${on?I.check:goal>1?v+'/'+goal:''}</button>
  </div>`;
}
function viewHabits(){
  const act=S.habits.filter(h=>!h.archived), arch=S.habits.filter(h=>h.archived);
  const n=todayS(); const due=act.filter(h=>scheduled(h,new Date())||h.freq==='weekly'); const done=due.filter(h=>doneOn(h,n)).length;
  let body='';
  if(!act.length) body=`<div class="panel empty">Build a routine. Add habits like “Drink water 8 glasses”, “Run 3 times a week” or “Read before bed” with a reminder alarm.<div style="margin-top:12px"><button class="btn primary" data-act="h-new">${I.plus} New habit</button></div></div>`;

  return `<div class="page-head"><div><h1>Habits</h1><div class="sub">${due.length?`${done} of ${due.length} done today`:'Nothing scheduled today'}</div></div><button class="btn primary" data-act="h-new">${I.plus} New habit</button></div>${body}`;
}

/* ================= charts ================= */
const CHART_COLS=['var(--accent)','#F2994A','#BB6BD9','#2BB5A6','#EB5757','#E8C547','#5B8DEF','#8A9A90'];
// Column chart: rows [{k,label,v,on,tip}], optional dashed reference line
function colChart(rows,o={}){
  const h=o.h||110,max=Math.max(1,...rows.map(r=>r.v),o.line||0),tag=o.act?'button':'div';
  return `<div class="chart"><div class="cplot" style="height:${h}px">${o.line?`<div class="cline" style="bottom:${o.line/max*100}%"><span>${esc(o.lineLabel||'')}</span></div>`:''}${rows.map(r=>`<${tag} class="cbar${r.on?' on':''}"${o.act?` data-act="${o.act}" data-v="${esc(r.k)}"`:''} title="${esc(r.tip||'')}" aria-label="${esc(r.tip||'')}"><i style="height:${r.v>0?Math.max(2,r.v/max*100):0}%"></i></${tag}>`).join('')}</div><div class="clabels">${rows.map(r=>`<span>${esc(r.label||'')}</span>`).join('')}</div></div>`;
}
// Donut of [[name,value]] sorted biggest first; anything past 7 slices is folded into "Others"
function donut(rows,center,sub){
  const total=rows.reduce((a,r)=>a+r[1],0); if(!total) return '';
  const top=rows.slice(0,7); if(rows.length>7) top.push(['Others',rows.slice(7).reduce((a,r)=>a+r[1],0)]);
  let at=0; const stops=top.map(([k,v],i)=>{const a=at;at+=v/total*100;return `${CHART_COLS[i]} ${a}% ${at}%`}).join(',');
  return `<div class="donutwrap"><div class="donut" style="background:conic-gradient(${stops})"><div><b class="num">${center}</b><span class="tiny muted">${sub}</span></div></div><div class="legend">${top.map(([k,v],i)=>`<span><i style="background:${CHART_COLS[i]}"></i>${esc(k)} <b class="num" style="margin-left:auto">${Math.round(v/total*100)}%</b></span>`).join('')}</div></div>`;
}
const spentIn=(a,b)=>r2(S.txns.reduce((x,t)=>t.type==='expense'&&t.date>=a&&t.date<=b?x+ +t.amount:x,0));
// Spending per month for the 6 months ending at ym
function monthsChart(ym,act){
  const [y,m]=ym.split('-').map(Number), rows=[];
  for(let i=5;i>=0;i--){const d=new Date(y,m-1-i,1),k=ymd(d).slice(0,7),v=spentIn(k+'-01',k+'-31');rows.push({k,label:MON[d.getMonth()],v,on:k===ym,tip:MONL[d.getMonth()]+' '+d.getFullYear()+': '+inr(v)})}
  const used=rows.filter(r=>r.v>0), avg=used.length?used.reduce((a,r)=>a+r.v,0)/used.length:0;
  return colChart(rows,{act,line:used.length>1?avg:0,lineLabel:'avg '+inr(avg)});
}
// Spending per day between two dates (yyyy-mm-dd)
function daysChart(a,b,line,lineLabel){
  const rows=[],n=dayNum(b)-dayNum(a)+1,wk=n<=7;
  for(let i=0;i<n;i++){const d=addDays(parseYmd(a),i),k=ymd(d),v=spentIn(k,k),dd=d.getDate();rows.push({k,label:wk?'MTWTFSS'[(d.getDay()+6)%7]:(dd===1||dd%5===0?String(dd):''),v,on:k<=todayS(),tip:fmtDay(k)+': '+inr(v)})}
  return colChart(rows,{h:wk?110:90,line,lineLabel});
}

function ruleHits(r,o){

function owed(){
  const o={}; S.people.forEach(p=>o[p.id]=0);
  S.trips.forEach(t=>(t.riders||[]).forEach(r=>{if(r in o)o[r]+=Number(t.each)||0}));
  S.pays.forEach(p=>{if(p.person in o)o[p.person]-=Number(p.amount)||0});
  Object.keys(o).forEach(k=>o[k]=r2(o[k])); return o;
}
function personLedger(pid){
  const e=[]; S.trips.forEach(t=>{if((t.riders||[]).includes(pid))e.push({kind:'trip',id:t.id,date:t.date,amt:+t.each,note:t.note,created:t.created})});
  S.pays.forEach(p=>{if(p.person===pid)e.push({kind:'pay',id:p.id,date:p.date,amt:-p.amount,note:'Paid via '+(p.mode||'UPI'),created:p.created})});
  return e.sort((a,b)=>a.date===b.date?(a.created||0)-(b.created||0):a.date<b.date?-1:1);
}
function waLink(p,amt){
  let ph=(p.phone||'').replace(/\D/g,''); if(ph.length===10) ph='91'+ph;
  const msg=`Hi ${p.name}, quick carpool update: your balance is ${inr(amt)}.`+(S.settings.upi?` You can pay to UPI ${S.settings.upi}.`:'')+' Thanks!';
  return {url:'https://wa.me/'+ph+'?text='+encodeURIComponent(msg),msg,ph};
}

function tripCalc(){
  const riders=$$('#tr-riders [aria-pressed="true"]').map(b=>b.dataset.v), mode=$('#tr-mode [aria-pressed="true"]').dataset.v;

  if(mode==='fixed') each=r2($('#tr-each').value);
  else {total=+$('#tr-total').value||0;me=$('#tr-me').checked;const n=riders.length+(me?1:0);each=n?r2(total/n):0}

}

/* ================= sound ================= */
const Snd={ctx:null,loopT:null,stopT:null,
  unlock(){try{if(!this.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;this.ctx=new C()}if(this.ctx.state==='suspended')this.ctx.resume().then(()=>refreshBanner()).catch(()=>{})}catch(e){}},
  ready(){return !!(this.ctx&&this.ctx.state==='running')},
  tone(f,start,dur,type,vol){const c=this.ctx,o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,start);g.gain.exponentialRampToValueAtTime(vol||.2,start+.02);g.gain.exponentialRampToValueAtTime(0.0001,start+dur);o.connect(g);g.connect(c.destination);o.start(start);o.stop(start+dur+.05)},
  pattern(name){
    const t=this.ctx.currentTime+.03;
    if(name==='beep'){for(let i=0;i<4;i++)this.tone(880,t+i*.22,.15,'square',.12);return 1.3}
    if(name==='digital'){for(let i=0;i<8;i++)this.tone(i%2?1046:1318,t+i*.09,.08,'square',.1);return 1.1}
    if(name==='gentle'){[523,659,784].forEach((f,i)=>this.tone(f,t+i*.35,1.2,'sine',.2));return 2.3}
    if(name==='siren'){for(let i=0;i<3;i++){this.tone(700,t+i*.5,.25,'sawtooth',.09);this.tone(1000,t+i*.5+.25,.25,'sawtooth',.09)}return 1.6}
    [1046,1318,1568,2093].forEach((f,i)=>this.tone(f,t+i*.16,.9,'triangle',.22));return 1.7;
  },
  play(name,loop,maxSec){this.stop();this.unlock();if(!this.ctx)return;const run=()=>{try{const d=this.pattern(name||'chime');if(loop)this.loopT=setTimeout(run,d*1000+350)}catch(e){}};run();if(loop)this.stopT=setTimeout(()=>this.stop(),(maxSec||90)*1000)},
  stop(){clearTimeout(this.loopT);clearTimeout(this.stopT);this.loopT=null}
};
const SOUNDS=[['chime','Chime'],['beep','Classic beep'],['digital','Digital alarm'],['siren','Loud siren'],['gentle','Gentle']];

/* ================= alarm engine ================= */
const Q=[]; let baseTitle='Mine', flashT=null;
function upcomingAlarms(fromMs,toMs){
  const out=[];
  const push=(key,kind,id,title,sub,at,since)=>{const ms=at.getTime();if(ms>=fromMs&&ms<toMs&&ms>=(since||0))out.push({key,kind,id,title,sub,at})};
  if(modOn('tasks'))S.tasks.forEach(t=>{if(t.done||!t.due)return;const base=taskBase(t);(t.rem||[]).forEach(m=>{const at=new Date(base.getTime()-m*60000);push(t.id+'@'+t.due+'T'+(t.time||'')+'@'+m,'task',t.id,t.title,m?(REM_OPTS.find(r=>r[0]===m)||[,''])[1].replace(' before',' before it’s due'):(t.time?'Due now':'Due today'),at,(t.remSet||t.created||0)-60000)})});
  const days=[];for(let d=new Date(fromMs-86400000);d.getTime()<toMs+86400000;d=addDays(d,1))days.push(new Date(d.getFullYear(),d.getMonth(),d.getDate()));
  // Missed tasks ring every day at the chosen time, starting the day after they were due, until done
  if(modOn('tasks')&&S.settings.missedOn!==false){const [mh,mm]=(S.settings.missedTime||'09:00').split(':').map(Number);S.tasks.forEach(t=>{if(t.done||!t.due)return;const first=addDays(parseYmd(t.due),1);days.forEach(d=>{if(d<first)return;const at=new Date(d);at.setHours(mh,mm,0,0);push('m:'+t.id+'@'+ymd(d),'task',t.id,t.title,'Missed · was due '+fmtDay(t.due),at,(t.created||0)-60000)})})}
  if(modOn('habits'))S.habits.filter(h=>!h.archived).forEach(h=>days.forEach(d=>{const s=ymd(d);if(!scheduled(h,d)&&h.freq!=='weekly')return;if(doneOn(h,s))return;if(h.freq==='weekly'&&weekCount(h,startOfWeek(d))>=(h.perWeek||3))return;(h.rem||[]).forEach(r=>{const [hh,mm]=r.split(':').map(Number);const at=new Date(d);at.setHours(hh,mm,0,0);push('h:'+h.id+'@'+s+'@'+r,'habit',h.id,h.icon+' '+h.name,h.goal>1?'Goal: '+h.goal+(h.unit?' '+h.unit:''):'Time for your habit',at,(h.remSet||h.created||0)-60000)})}));
  if(modOn('money'))S.accounts.filter(a=>a.type==='card'&&a.dueDay&&a.remind!==false).forEach(a=>{const due=nextDue(a);if(!due)return;[2,0].forEach(b=>{const at=addDays(due,-b);at.setHours(10,0,0,0);push('c:'+a.id+'@'+ymd(due)+'@'+b,'card',a.id,a.name+' bill '+(b?'due in 2 days':'due today'),'Pay your card bill',at,(a.remSet||0)-60000)})});
  Object.entries(A.snoozes).forEach(([k,v])=>push(k,v.kind,v.id,v.title,'Snoozed reminder',new Date(v.at)));
  return out.sort((a,b)=>a.at-b.at);
}
function checkAlarms(){
  if(NATIVE) return; // the Android app rings alarms natively
  const now=Date.now();
  const due=upcomingAlarms(now-12*3600000,now+1000).filter(a=>!A.fired[a.key]);
  due.forEach(a=>{a.missed=now-a.at.getTime()>3*60000;raiseAlarm(a)});
  // prune bookkeeping
  Object.keys(A.fired).forEach(k=>{if(now-A.fired[k]>4*86400000)delete A.fired[k]});
}
function raiseAlarm(a){
  if(NATIVE){if(a.kind==='focus')toast(a.title);return}
  if(A.fired[a.key]&&!a.key.startsWith('focus@')&&Q.find(x=>x.key===a.key)) return;
  A.fired[a.key]=Date.now(); if(A.snoozes[a.key]) delete A.snoozes[a.key]; Store.saveAlarms();
  Q.push(a); Q.sort((x,y)=>x.at-y.at);
  renderAlarm();
  if(!a.missed) Snd.play(S.settings.sound,true,90); else if(!Snd.loopT) Snd.play(S.settings.sound,false);
  try{navigator.vibrate&&navigator.vibrate([400,200,400,200,400])}catch(e){}
  try{if('Notification' in window&&Notification.permission==='granted'){const n=new Notification('⏰ '+a.title,{body:(a.missed?'Missed at '+fmtTime(hhmm(a.at))+'. ':'')+(a.sub||''),tag:a.key,requireInteraction:true});n.onclick=()=>{window.focus();n.close()}}}catch(e){}
  clearInterval(flashT); let f=false; flashT=setInterval(()=>{document.title=(f=!f)?'⏰ '+a.title:baseTitle},1000);
}
function renderAlarm(){
  const el=$('#alarm');
  if(!Q.length){el.classList.remove('open');el.innerHTML='';Snd.stop();clearInterval(flashT);document.title=baseTitle;return}
  const a=Q[0], sn=S.settings.snooze||10;
  const kindL={task:'Task reminder',habit:'Habit reminder',card:'Credit card bill',focus:'Focus timer'}[a.kind]||'Reminder';
  let acts='';
  if(a.kind==='task') acts=`<button class="main" data-act="al-done">Mark done</button><button data-act="al-snooze" data-v="${sn}">Snooze ${sn} min</button><button data-act="al-snooze" data-v="60">1 hour</button><button data-act="al-dismiss">Dismiss</button>`;
  else if(a.kind==='habit') acts=`<button class="main" data-act="al-hdone">Check in</button><button data-act="al-snooze" data-v="${sn}">Snooze ${sn} min</button><button data-act="al-dismiss">Skip</button>`;
  else if(a.kind==='card') acts=`<button class="main" data-act="al-money">Open Money</button><button data-act="al-snooze" data-v="240">Remind in 4 hours</button><button data-act="al-dismiss">Dismiss</button>`;
  else acts=`<button class="main" data-act="al-dismiss">OK</button>${F.mode&&a.kind==='focus'?`<button data-act="al-fnext">Start ${F.mode==='focus'?'focus':'break'}</button>`:''}`;
  el.innerHTML=`${bigBell}<div class="when num">${fmtTime(hhmm(a.at))}</div><div class="what">${esc(a.title)}</div><div class="kind">${kindL}${a.missed?' · missed while Mine was closed':''}${a.sub?' · '+esc(a.sub):''}</div><div class="acts">${acts}</div>${Q.length>1?`<div class="more">${Q.length-1} more reminder${Q.length>2?'s':''} waiting</div>`:''}<button data-act="al-silence" style="margin-top:14px;background:none;border:0;color:inherit;text-decoration:underline;font-weight:600">Silence sound</button>`;
  el.classList.add('open');
}
function alarmNext(){Q.shift();if(Q.length&&!Q[0].missed)Snd.play(S.settings.sound,true,90);else Snd.stop();renderAlarm()}

function refreshBanner(){const b=$('#alarm-banner');if(b)b.outerHTML=alarmBanner()}
function alarmBanner(){
  if(NATIVE){const st=nativeStatus();const miss=!st.notif?'notif':!st.exact?'exact':!st.fullscreen?'fullscreen':null;if(!miss)return '<div id="alarm-banner" class="hide"></div>';
    const msg={notif:'Allow notifications so your alarms can ring.',exact:'Allow “Alarms & reminders” so alarms ring exactly on time.',fullscreen:'Allow full-screen alarms so they show on the lock screen.'}[miss];
    return `<div class="banner" id="alarm-banner">${I.bell}<div class="grow">${msg}</div><button class="btn sm" data-act="native-perm" data-v="${miss}">Allow</button></div>`}
  const notifOK=!('Notification' in window)||Notification.permission!=='default';

async function bkKey(pass,salt){const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},b,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function encBackup(text,pass){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await bkKey(pass,salt),new TextEncoder().encode(text));return JSON.stringify({mineEnc:1,salt:b64(salt),iv:b64(iv),data:b64(ct)})}
async function decBackup(o,pass){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},await bkKey(pass,unb64(o.salt)),unb64(o.data));return new TextDecoder().decode(pt)}
