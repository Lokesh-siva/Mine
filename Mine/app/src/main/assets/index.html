    ${rest?`<div class="gp-rest"><div class="tiny" style="font-weight:700;letter-spacing:.1em">REST</div><div class="gp-rest-v num" id="gp-rv">${mmss((c.restEnd-Date.now())/1000)}</div><div class="small">Up next: ${esc(e.n)}${(it.sets||1)>1?' · '+(x.circuit?'round ':'set ')+(st.s+1)+' of '+it.sets:''}</div><div class="row" style="justify-content:center;gap:8px;margin-top:16px"><button class="btn" data-act="gp-rest" data-v="-15">−15s</button><button class="btn" data-act="gp-rest" data-v="15">+15s</button><button class="btn primary" data-act="gp-rest" data-v="0">Skip rest</button></div></div>`:''}

// Timers update in place so typing isn't interrupted
function gpTick(){
  const c=S.gym.cur; if(!c||c.finished) return;
  const ck=$('#gp-clock'); if(ck) ck.textContent=mmss((Date.now()-c.started)/1000);
  if(c.restEnd){const left=(c.restEnd-Date.now())/1000,rv=$('#gp-rv');if(left<=0){c.restEnd=0;gpBeep(3);gpRender();return}if(rv)rv.textContent=mmss(left);if(left<=3.2&&left>2.9)gpBeep(1)}
  if(c.hold){const left=(c.hold.end-Date.now())/1000,hv=$('#gp-hv');if(left<=0){c.hold=null;gpBeep(3);if(hv)hv.textContent='Done!'}else if(hv)hv.textContent=mmss(left)}
  const tm=c.tm; if(tm){
    const x=gpSess(),it=x.items[tm.i],el=tm.acc+(tm.run?(Date.now()-tm.from)/1000:0),tv=$('#gp-tv'),tl=$('#gp-tl');
    if((it.type||exType(it.ex))==='interval'){
      const len=it.work+it.rest,tot=it.rounds*len;
      if(el>=tot){if(tm.run){tm.run=false;tm.acc=tot;gpBeep(3);gpRender()}if(tv)tv.textContent='Done';return}
      const r=Math.floor(el/len)+1,ph=el%len<it.work?'hard':'easy',left=ph==='hard'?it.work-el%len:len-el%len;
      if(GP.lastPhase&&GP.lastPhase!==ph+r&&tm.run)gpBeep(ph==='hard'?3:2);GP.lastPhase=ph+r;
      if(tv){tv.textContent=mmss(left);tv.classList.toggle('hard',ph==='hard')}if(tl)tl.textContent=`Round ${r} of ${it.rounds} · ${ph==='hard'?'GO HARD':'easy'}`;
    } else {
      const left=it.mins*60-el;
      if(left<=0&&!tm.beeped){tm.beeped=1;gpBeep(3)}
      if(tv)tv.textContent=left>0?mmss(left):'+'+mmss(-left);if(tl)tl.textContent=left>0?'Time left':'Target reached · keep going or mark done';
    }
  }
}
// Fills a ticked set's empty boxes: target reps, and last time's weight
function gpFill(i,s){
  const it=gpSess().items[i],set=S.gym.cur.items[i].sets[s],t=it.type||exType(it.ex);
  if(t==='reps'&&set.r===''){const m=String(it.reps).match(/\d+/g);if(m)set.r=m[m.length>1?1:0]}
  if(t==='hold'&&set.r===''){const m=String(it.reps).match(/\d+/);if(m)set.r=m[0]}
  if(set.w===''){const l=gymLast(it.ex);if(l){const ls=l.sets[Math.min(s,l.sets.length-1)];if(ls&&ls.w)set.w=ls.w}}
}
function gpAllDone(i){
  const c=S.gym.cur,steps=gymSteps(gpSess());
  c.items[i].sets.forEach((z,s)=>{if(!z.done){gpFill(i,s);z.done=true}});
  c.restEnd=0;const nx=steps.findIndex(z=>!c.items[z.i].sets[z.s].done);
  if(nx<0){Store.mark('gym');return gpFinish()}
  c.at=nx;Store.mark('gym');gpRender();toast(EX[c.items[i].ex].n+' done');
}
function gpSetDone(i,s){
  const c=S.gym.cur,x=gpSess(),it=x.items[i],set=c.items[i].sets[s],steps=gymSteps(x);
  set.done=!set.done;
  if(set.done){
    const t=it.type||exType(it.ex);
    gpFill(i,s);
    const nx=steps.findIndex(z=>!c.items[z.i].sets[z.s].done);
    if(nx<0){Store.mark('gym');return gpFinish()}
    // rest: normal sets use the exercise's rest; in a circuit only after the last exercise of a round
    let rest=it.rest||0;
    if(x.circuit&&it.sets&&!it.wu){const cur=steps.findIndex(z=>z.i===i&&z.s===s),nz=steps[cur+1];rest=it.rest||(nz&&nz.s!==s?60:0)}
    if(t==='time'||t==='interval') rest=0;
    c.at=nx; if(rest) c.restEnd=Date.now()+rest*1000;
  }
  Store.mark('gym'); gpRender();
}
// One question when you finish early: the usual answer is that you did it all and just didn't tick every set
function gpFinishAsk(){
  const c=S.gym.cur,steps=gymSteps(gpSess()),done=steps.filter(z=>c.items[z.i].sets[z.s].done).length;
  if(done===steps.length) return gpFinish();
  openModal(sheetHead('Finish workout')+`<p class="small muted" style="margin-top:0">You’ve ticked ${done} of ${steps.length} steps.</p>
    <div class="gfin"><button class="btn primary" data-act="gp-fin" data-v="all">${I.check}<span><b>I did the whole workout</b><span>Saves everything, using the target reps and your last weights where you left boxes empty</span></span></button>

    <button class="btn ghost" data-act="close-modal"><span><b>Keep going</b></span></button></div>`,{type:'gpfin'});
}
function gpFinish(){
  const c=S.gym.cur,x=gpSess(),dur=Math.round((Date.now()-c.started)/1000);
  const items=c.items.map((l,i)=>({ex:l.ex,sets:l.sets.filter(s=>s.done).map(s=>({w:s.w===''?0:+s.w,r:s.r===''?0:+s.r}))})).filter(l=>l.sets.length);
  if(!items.length) return gpFinishAsk();
  const prs=[];items.forEach(l=>{if(exType(l.ex)!=='reps')return;const b=gymBest(l.ex),m=l.sets.reduce((a,s)=>s.w>a.w?s:a,{w:0,r:0});if(b&&m.w>b.w)prs.push({ex:l.ex,w:m.w,r:m.r})});
  S.gym.logs.push({id:uid(),date:todayS(),prog:x.home?null:gymProg(),seq:x.home?null:x.seq,home:x.home||null,title:x.title,kind:x.kind,dur,items});
  // finishing the next workout (or a later one) moves you on; home workouts don't
  if(!x.home&&x.seq>=gymPos()) S.gym.pos[gymProg()]=x.seq+1;
  c.finished={dur,sets:items.reduce((a,l)=>a+l.sets.length,0),vol:r2(items.reduce((a,l)=>a+l.sets.reduce((b,s)=>b+s.w*s.r,0),0)),prs};
  c.restEnd=0;c.tm=null;Store.mark('gym');gpBeep(2);gpFinishScreen();
}

async function bkKey(pass,salt){const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},b,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}

async function encBackup(text,pass){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await bkKey(pass,salt),new TextEncoder().encode(text));return JSON.stringify({mineEnc:1,salt:b64(salt),iv:b64(iv),data:b64(ct)})}
async function decBackup(o,pass){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},await bkKey(pass,unb64(o.salt)),unb64(o.data));return new TextDecoder().decode(pt)}

    case 'cp-pay-edit': openPay(id); break;
    case 'cp-pay-save': savePay(); break;
    case 'cp-pay-del': confirmBox('Delete this payment?','Delete',()=>{const p=S.pays.find(x=>x.id===id);const marks=['carpool'];if(p&&p.txId){const t=S.txns.find(x=>x.id===p.txId);if(t){S.txns=S.txns.filter(x=>x.id!==t.id);marks.push('money','txn_'+t.date.slice(0,7))}}S.pays=S.pays.filter(x=>x.id!==id);Store.mark(...marks);render()}); break;
    case 'cp-copy': {const p=personById(id);const m=waLink(p,owed()[id]).msg;try{await navigator.clipboard.writeText(m);toast('Reminder copied')}catch(err){openModal(sheetHead('Reminder message')+`<textarea class="in" rows="4">${esc(m)}</textarea><div class="sheet-foot"><button class="btn primary" data-act="close-modal">Done</button></div>`)}break}
    /* alarms */
    case 'al-done': {const a=Q[0];const t=S.tasks.find(x=>x.id===a.id);if(t&&!t.done)toggleTask(t.id);alarmNext();break}
    case 'al-hdone': {const a=Q[0];const h=S.habits.find(x=>x.id===a.id);if(h){S.hlog[h.id]=S.hlog[h.id]||{};S.hlog[h.id][todayS()]=h.goal||1;Store.mark('habits');render()}alarmNext();break}
    case 'al-snooze': {const a=Q[0];const at=Date.now()+(+v)*60000;A.snoozes['snz:'+a.kind+':'+a.id+':'+at]={at,kind:a.kind,id:a.id,title:a.title};Store.saveAlarms();toast('Snoozed until '+fmtTime(hhmm(new Date(at))));alarmNext();break}
    case 'al-dismiss': alarmNext(); break;
    case 'al-money': alarmNext(); location.hash='money'; break;
    case 'al-fnext': alarmNext(); F.end=Date.now()+fDur(F.mode); F.running=true; syncNative(); render(); break;
    case 'al-silence': Snd.stop(); break;
    case 'enable-alarms': Snd.unlock(); setTimeout(()=>{Snd.play(S.settings.sound,false);refreshBanner()},150); if('Notification' in window&&Notification.permission==='default'){try{await Notification.requestPermission()}catch(err){}} refreshBanner(); break;
    case 'enable-notif': try{const r=await Notification.requestPermission();toast(r==='granted'?'Notifications allowed':'Notifications not allowed. Alarms still ring while Mine is open.')}catch(err){toast('Notifications aren’t available here. Alarms still ring while Mine is open.')} render(); break;
    case 'dismiss-notif': el.closest('.banner').remove(); break;
    /* settings */
    case 'test-sound': Snd.unlock(); setTimeout(()=>Snd.play(S.settings.sound,false),100); break;
    case 'mod-toggle': {const off=new Set(S.settings.modOff||[]);if(off.has(v))off.delete(v);else{if(modules().length<=1)return toast('Keep at least one module on');off.add(v)}S.settings.modOff=[...off];Store.mark('settings');render();break}
    case 'mod-move': {const o=modOrder(),i=o.indexOf(v),j=i+ +el.dataset.d;if(j<0||j>=o.length)break;[o[i],o[j]]=[o[j],o[i]];S.settings.modOrder=o;Store.mark('settings');render();break}
    case 'missed-toggle': S.settings.missedOn=S.settings.missedOn===false; Store.mark('settings'); syncNative(); render(); toast(S.settings.missedOn?'Missed tasks will ring daily at '+fmtTime(S.settings.missedTime||'09:00'):'Missed-task reminders off'); break;
    case 'accent': S.settings.accent=v; applyTheme(); Store.mark('settings'); render(); break;
    case 'theme': S.settings.theme=v; applyTheme(); Store.mark('settings'); render(); break;
    case 'native-perm': try{window.MineNative.openAlarmSettings(v)}catch(err){} break;
    case 'test-alarm': try{window.MineNative.testAlarm(10);toast('Test alarm in 10 seconds. You can lock the phone.')}catch(err){} break;
    case 'app-lock': try{window.MineNative.setLock(v==='on')}catch(err){} render(); break;
    case 'backup': {const pw=(document.getElementById('bk-pass')||{}).value||'';const txt=JSON.stringify(S,null,1);
      if(pw){encBackup(txt,pw).then(e=>saveFile('mine-backup-'+todayS()+'.enc.json',e)).catch(()=>toast('Could not encrypt the backup'))}else saveFile('mine-backup-'+todayS()+'.json',txt);break}
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='accent-custom'){S.settings.accent=t.value.toUpperCase();applyTheme()}
  else if(t.id==='quick'){const h=$('#quick-hint');if(h)h.innerHTML=quickHint(t.value)}
  else if(t.classList&&t.classList.contains('gp-in')&&S.gym.cur){S.gym.cur.items[+t.dataset.i].sets[+t.dataset.s][t.dataset.f]=t.value;Store.saveLocal()}
  else if(t.id==='tx-search'){UI.txSearch=t.value;const pos=t.selectionStart;render();const n=$('#tx-search');if(n){n.focus();n.setSelectionRange(pos,pos)}}
  else if(t.closest&&t.closest('#tr-fixed,#tr-split')) updateTripPreview();
  else if(t.classList.contains('x-share')){const x=modalCtx.split.ppl.find(x=>x.p===t.dataset.p);if(x){x.amt=+t.value||0;modalCtx.split.manual=true;splitSum()}}
  else if(t.id==='x-amt'&&modalCtx&&modalCtx.split&&modalCtx.split.ppl.length){if(!modalCtx.split.manual){splitEven();modalCtx.split.ppl.forEach(x=>{const i=$(`.x-share[data-p="${x.p}"]`);if(i)i.value=x.amt})}splitSum()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.set){let v=t.value;if(t.type==='number')v=+v||0;S.settings[t.dataset.set]=v;Store.mark('settings');if(t.dataset.set==='budget')toast('Budget saved');if(t.dataset.set.endsWith('Min')&&!F.running)F.remaining=null}
  if(t.id==='accent-custom'){S.settings.accent=t.value.toUpperCase();applyTheme();Store.mark('settings');render()}
  if(t.id==='sms-from'&&t.value){const d=parseYmd(t.value);smsSetFrom(d.getTime())}
  if(t.id==='t-rep') $('#t-int-wrap').classList.toggle('hide',t.value!=='custom');
  if(t.dataset.set==='snooze'||t.dataset.set==='allDayTime'||t.dataset.set==='missedTime')syncNative();
  if(t.id==='a-type'){const c=t.value==='card';$('#a-card').classList.toggle('hide',!c)}
  if(t.id==='f-task') F.taskId=t.value;
  if(t.id==='tr-me') updateTripPreview();
  if(t.id==='x-split-me'){modalCtx.split.me=t.checked;splitEven();splitBox()}
  if(t.id==='restore-file'&&t.files[0]){const r=new FileReader();r.onload=async()=>{try{let d=JSON.parse(r.result);if(d&&d.mineEnc){const pw=(document.getElementById('bk-pass')||{}).value||'';if(!pw)return toast('Type the backup password above, then restore again');try{d=JSON.parse(await decBackup(d,pw))}catch(e2){return toast('Wrong backup password')}}if(!d||!Array.isArray(d.tasks))throw 0;confirmBox('Replace everything in Mine with this backup?','Restore',()=>{['settings','accounts','cats','txns','lists','tasks','focus','habits','hlog','people','trips','pays','mcat','rules','gym'].forEach(k=>{if(k in d)S[k]=d[k]});gymInit();const ms=[...new Set(S.txns.map(x=>'txn_'+x.date.slice(0,7)))];Store.mark('settings','money','tasks','habits','carpool','gym',...ms);applyTheme();render();toast('Backup restored')})}catch(err){toast('That file isn’t a Mine backup')}};r.readAsText(t.files[0])}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  const t=e.target;
  if(t.id==='quick'){e.preventDefault();addQuick(t.value,t.dataset.date)}
  else if(t.id==='x-split-new'){e.preventDefault();$('[data-act="x-split-add"]').click()}
  else if(t.id==='t-newsub'){e.preventDefault();$('[data-act="add-sub"]').click()}
  else if(t.id==='cat-new-exp'||t.id==='cat-new-inc'){e.preventDefault();$(`[data-act="cat-add"][data-k="${t.id.slice(-3)}"]`).click()}
});
window.addEventListener('hashchange',()=>{if(route()==='tasks')UI.sel='all';render();window.scrollTo(0,0)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkAlarms();if(['today','habits'].includes(route()))render()}});

/* ================= init ================= */
Store.loadLocal(); gymInit(); applyTheme(); smsTimeBackfill(); render(); syncNative();
let lastDay=todayS();
setInterval(()=>{checkAlarms();if(todayS()!==lastDay){lastDay=todayS();syncNative();if(!$('#modal').classList.contains('open'))render()}},15000);
setTimeout(checkAlarms,1500);
setInterval(syncNative,30*60000);
connect();
</script>
</body></html>
