    case 'rule-save': saveRule(); break;
    case 'rule-del': {const b=modalCtx&&modalCtx.back;confirmBox('Delete this rule?','Delete',()=>{S.rules=S.rules.filter(x=>x.id!==id);Store.mark('money');rulesSheet(b);toast('Rule deleted')});break}
    case 'rule-up': {const i=S.rules.findIndex(x=>x.id===id);if(i>0){[S.rules[i-1],S.rules[i]]=[S.rules[i],S.rules[i-1]];Store.mark('money')}rulesSheet(modalCtx&&modalCtx.back);break}
    case 'sms-ignore': try{window.MineNative.smsIgnore(id)}catch(err){} render(); smsReviewSheet(); toast('Ignored · find it in the Ignored tab'); break;
    case 'sms-open': {let ok=false;try{ok=window.MineNative.smsOpen(v)}catch(err){} if(!ok)toast('Couldn’t open Messages');break}
    case 'sms-unignore': try{window.MineNative.smsUnignore(id)}catch(err){} render(); smsReviewSheet(); toast('Moved back to review'); break;
    case 'sms-from-reset': smsSetFrom(0); break;
    case 'sms-check': {if(!watchSettings().sms){smsReviewSheet();break}let n=0;try{n=window.MineNative.smsScan()}catch(err){}toast(n?n+' new bank message'+(n>1?'s':'')+' found':'No new bank messages');render();smsReviewSheet();break}
    case 'sms-on': try{window.MineNative.requestSms()}catch(err){} break;
    case 'sms-toggle': if(v==='on'){try{window.MineNative.requestSms()}catch(err){}}else{try{window.MineNative.setWatch('sms',false)}catch(err){}render()} break;
    case 'watch-weekly': try{window.MineNative.setWatch('weekly',v==='on')}catch(err){} render(); break;
    case 'watch-monthly': try{window.MineNative.setWatch('monthly',v==='on')}catch(err){} render(); break;
    case 'review-open': openReview(v); break;
    case 'review-close': closeReview(); break;
    case 'review-kind': RV.kind=v; RV.start=new Date(); renderReview(); break;
    case 'review-nav': {const b=RV.start||new Date();RV.start=RV.kind==='week'?addDays(b,7*v):new Date(b.getFullYear(),b.getMonth()+ +v,1);renderReview();$('#review').scrollTop=0;break}
    case 'tx-edit': openTx(id); break;
    case 'tx-save': saveTxFromModal(); break;
    case 'tx-del': confirmBox('Delete this transaction?','Delete',()=>{const t=S.txns.find(x=>x.id===id);S.txns=S.txns.filter(x=>x.id!==id);S.pays.forEach(p=>{if(p.txId===id)delete p.txId});Store.mark('money','carpool','txn_'+t.date.slice(0,7));render()}); break;
    case 'tx-csv': {const rows=[['Date','Time','Amount','Category','Paid with','Note']].concat(S.txns.filter(t=>t.type==='expense').sort((a,b)=>-txOrder(a,b)).map(t=>[t.date,t.time||'',t.amount,t.cat||'',(acctById(t.acc)||{}).name||'',t.note||'']));saveFile('mine-expenses.csv',rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'));break}
    case 'budget': {location.hash='prefs';setTimeout(()=>{const b=$('#s-budget');b&&b.focus()},50);break}
    case 'acct-manage': acctManager(); break;
    case 'acct-new': openAcct(); break;
    case 'acct-edit': openAcct(id); break;
    case 'acct-save': {const a=modalCtx.acct;a.name=$('#a-name').value.trim();if(!a.name)return toast('Give it a name');a.type=$('#a-type').value;a.last4=($('#a-last4').value.match(/\d{4}/)||[''])[0];if(a.type==='card'){a.dueDay=Math.min(31,Math.max(0,parseInt($('#a-due').value)||0))||null;a.remind=$('#a-rem').checked;a.remSet=Date.now()}const isNew=a._new;delete a._new;if(isNew)S.accounts.push(a);else S.accounts[S.accounts.findIndex(x=>x.id===a.id)]=a;Store.mark('money');render();acctManager();break}
    case 'acct-del': if(S.txns.some(t=>t.acc===id||t.to===id)) return toast('Some expenses use this. Change or delete them first.'); confirmBox('Delete this payment method?','Delete',()=>{S.accounts=S.accounts.filter(a=>a.id!==id);if(UI.acctFilter===id)UI.acctFilter='all';Store.mark('money');render()}); break;
    case 'cat-add': {const k=el.dataset.k,i=$('#cat-new-'+k),c=i.value.trim();if(c&&!S.cats[k].includes(c)){S.cats[k].push(c);Store.mark('money');acctManager()}break}
    case 'cat-del': {const k=el.dataset.k;if(S.cats[k].length<=1)return toast('Keep at least one category');S.cats[k]=S.cats[k].filter(c=>c!==v);Store.mark('money');acctManager();break}
    /* carpool */
    case 'cp-person-new': {const back=el.dataset.back;if(back==='trip')modalCtx.tripDraft={...modalCtx.trip,...tripCalc()};openModal(personEditor({_new:true,id:uid()},back),{type:'person-edit',person:{_new:true,id:uid()},prev:back==='trip'?modalCtx:null});break}
    case 'cp-person-edit': {const p=Object.assign({},personById(id));openModal(personEditor(p),{type:'person-edit',person:p});break}
    case 'cp-person-save': {const c=modalCtx,p=c.person;p.name=$('#pp-name').value.trim();p.phone=$('#pp-phone').value.trim();if(!p.name)return toast('Enter a name');const isNew=p._new;delete p._new;if(isNew)S.people.push(p);else S.people[S.people.findIndex(x=>x.id===p.id)]=p;Store.mark('carpool');
      if(c.prev){const pr=c.prev;const t=Object.assign(pr.trip,pr.tripDraft||{});t.riders=[...(t.riders||[]),p.id];openModal(tripEditor(t,pr.isNew),{type:'trip',trip:t,isNew:pr.isNew});updateTripPreview()}else{closeModal()}render();break}
    case 'cp-person-del': {const o=owed();confirmBox((o[id]?'They still have a balance of '+inr(o[id])+'. ':'')+'Delete this person and their trip and payment history?','Delete',()=>{S.people=S.people.filter(p=>p.id!==id);S.trips.forEach(t=>t.riders=(t.riders||[]).filter(r=>r!==id));S.trips=S.trips.filter(t=>t.riders.length);S.pays=S.pays.filter(p=>p.person!==id);Store.mark('carpool');render()});break}
    case 'cp-person': personDetail(id); break;
    case 'cp-trip-new': openTrip(); break;
    case 'cp-trip-edit': openTrip(id); break;
    case 'tr-rider': el.setAttribute('aria-pressed',el.getAttribute('aria-pressed')==='true'?'false':'true'); updateTripPreview(); break;
    case 'tr-mode': $$('#tr-mode button').forEach(b=>b.setAttribute('aria-pressed',b===el?'true':'false')); $('#tr-fixed').classList.toggle('hide',v!=='fixed'); $('#tr-split').classList.toggle('hide',v!=='split'); updateTripPreview(); break;
    case 'cp-trip-save': {const c=modalCtx,t=c.trip,calc=tripCalc();if(!calc.riders.length)return toast('Pick at least one rider');if(!(calc.each>0))return toast('Enter an amount');Object.assign(t,calc,{date:$('#tr-date').value||todayS(),note:$('#tr-note').value.trim()});if(c.isNew)S.trips.push(t);else S.trips[S.trips.findIndex(x=>x.id===t.id)]=t;Store.mark('carpool');closeModal();render();toast('Trip added: '+inr(t.each)+' each');break}
    case 'cp-trip-del': confirmBox('Delete this trip?','Delete',()=>{S.trips=S.trips.filter(t=>t.id!==id);Store.mark('carpool');render()}); break;
    case 'cp-pay-new': openPay(null,id); break;
    case 'cp-pay-edit': openPay(id); break;
    case 'cp-pay-save': savePay(); break;
    case 'cp-pay-del': confirmBox('Delete this payment?','Delete',()=>{const p=S.pays.find(x=>x.id===id);const marks=['carpool'];if(p&&p.txId){const t=S.txns.find(x=>x.id===p.txId);if(t){S.txns=S.txns.filter(x=>x.id!==t.id);marks.push('money','txn_'+t.date.slice(0,7))}}S.pays=S.pays.filter(x=>x.id!==id);Store.mark(...marks);render()}); break;
    case 'cp-copy': {const p=personById(id);const m=waLink(p,owed()[id]).msg;try{await navigator.clipboard.writeText(m);toast('Reminder copied')}catch(err){openModal(sheetHead('Reminder message')+`<textarea class="in" rows="4">${esc(m)}</textarea><div class="sheet-foot"><button class="btn primary" data-act="close-modal">Done</button></div>`)}break}
    /* alarms */
    case 'al-done': {const a=Q[0];const t=S.tasks.find(x=>x.id===a.id);if(t&&!t.done)toggleTask(t.id);alarmNext();break}
    case 'al-hdone': {const a=Q[0];const h=S.habits.find(x=>x.id===a.id);if(h){S.hlog[h.id]=S.hlog[h.id]||{};S.hlog[h.id][todayS()]=h.goal||1;Store.mark('habits');render()}alarmNext();break}
    case 'al-snooze': {const a=Q[0];const at=Date.now()+(+v)*60000;A.snoozes['snz:'+a.kind+':'+a.id+':'+at]={at,kind:a.kind,id:a.id,title:a.title};Store.saveAlarms();toast('Snoozed until '+fmtTime(hhmm(new Date(at))));alarmNext();break}
    case 'al-dismiss': alarmNext(); break;
    case 'al-money': alarmNext(); location.hash='money'; break;
    case 'al-fnext': alarmNext(); F.end=Date.now()+fDur(F.mode); F.running=true; syncNative(); render(); break;
    case 'al-silence': Snd.stop(); break;
    case 'enable-alarms': Snd.unlock(); setTimeout(()=>{Snd.play(S.settings.sound,false);refreshBanner()},150); if('Notification' in window&&Notification.permission==='default'){try{await Notification.requestPermission()}catch(err){}} refreshBanner(); break;
    case 'enable-notif': try{const r=await Notification.requestPermission();toast(r==='granted'?'Notifications allowed':'Notifications not allowed. Alarms still ring while Mine is open.')}catch(err){toast('Notifications aren’t available here. Alarms still ring while Mine is open.')} render(); break;
    case 'dismiss-notif': el.closest('.banner').remove(); break;
    /* settings */
    case 'test-sound': Snd.unlock(); setTimeout(()=>Snd.play(S.settings.sound,false),100); break;
    case 'mod-toggle': {const off=new Set(S.settings.modOff||[]);if(off.has(v))off.delete(v);else{if(modules().length<=1)return toast('Keep at least one module on');off.add(v)}S.settings.modOff=[...off];Store.mark('settings');render();break}
    case 'mod-move': {const o=modOrder(),i=o.indexOf(v),j=i+ +el.dataset.d;if(j<0||j>=o.length)break;[o[i],o[j]]=[o[j],o[i]];S.settings.modOrder=o;Store.mark('settings');render();break}
    case 'missed-toggle': S.settings.missedOn=S.settings.missedOn===false; Store.mark('settings'); syncNative(); render(); toast(S.settings.missedOn?'Missed tasks will ring daily at '+fmtTime(S.settings.missedTime||'09:00'):'Missed-task reminders off'); break;
    case 'accent': S.settings.accent=v; applyTheme(); Store.mark('settings'); render(); break;
    case 'theme': S.settings.theme=v; applyTheme(); Store.mark('settings'); render(); break;
    case 'native-perm': try{window.MineNative.openAlarmSettings(v)}catch(err){} break;
    case 'test-alarm': try{window.MineNative.testAlarm(10);toast('Test alarm in 10 seconds. You can lock the phone.')}catch(err){} break;
    case 'app-lock': try{window.MineNative.setLock(v==='on')}catch(err){} render(); break;
    case 'backup': {const pw=(document.getElementById('bk-pass')||{}).value||'';const txt=JSON.stringify(S,null,1);
      if(pw){encBackup(txt,pw).then(e=>saveFile('mine-backup-'+todayS()+'.enc.json',e)).catch(()=>toast('Could not encrypt the backup'))}else saveFile('mine-backup-'+todayS()+'.json',txt);break}
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='accent-custom'){S.settings.accent=t.value.toUpperCase();applyTheme()}
  else if(t.id==='quick'){const h=$('#quick-hint');if(h)h.innerHTML=quickHint(t.value)}
  else if(t.id==='tx-search'){UI.txSearch=t.value;const pos=t.selectionStart;render();const n=$('#tx-search');if(n){n.focus();n.setSelectionRange(pos,pos)}}
  else if(t.closest&&t.closest('#tr-fixed,#tr-split')) updateTripPreview();
  else if(t.classList.contains('x-share')){const x=modalCtx.split.ppl.find(x=>x.p===t.dataset.p);if(x){x.amt=+t.value||0;modalCtx.split.manual=true;splitSum()}}
  else if(t.id==='x-amt'&&modalCtx&&modalCtx.split&&modalCtx.split.ppl.length){if(!modalCtx.split.manual){splitEven();modalCtx.split.ppl.forEach(x=>{const i=$(`.x-share[data-p="${x.p}"]`);if(i)i.value=x.amt})}splitSum()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.set){let v=t.value;if(t.type==='number')v=+v||0;S.settings[t.dataset.set]=v;Store.mark('settings');if(t.dataset.set==='budget')toast('Budget saved');if(t.dataset.set.endsWith('Min')&&!F.running)F.remaining=null}
  if(t.id==='accent-custom'){S.settings.accent=t.value.toUpperCase();applyTheme();Store.mark('settings');render()}
  if(t.id==='sms-from'&&t.value){const d=parseYmd(t.value);smsSetFrom(d.getTime())}
  if(t.id==='t-rep') $('#t-int-wrap').classList.toggle('hide',t.value!=='custom');
  if(t.dataset.set==='snooze'||t.dataset.set==='allDayTime'||t.dataset.set==='missedTime')syncNative();
  if(t.id==='a-type'){const c=t.value==='card';$('#a-card').classList.toggle('hide',!c)}
  if(t.id==='f-task') F.taskId=t.value;
  if(t.id==='tr-me') updateTripPreview();
  if(t.id==='x-split-me'){modalCtx.split.me=t.checked;splitEven();splitBox()}
  if(t.id==='restore-file'&&t.files[0]){const r=new FileReader();r.onload=async()=>{try{let d=JSON.parse(r.result);if(d&&d.mineEnc){const pw=(document.getElementById('bk-pass')||{}).value||'';if(!pw)return toast('Type the backup password above, then restore again');try{d=JSON.parse(await decBackup(d,pw))}catch(e2){return toast('Wrong backup password')}}if(!d||!Array.isArray(d.tasks))throw 0;confirmBox('Replace everything in Mine with this backup?','Restore',()=>{['settings','accounts','cats','txns','lists','tasks','focus','habits','hlog','people','trips','pays','mcat','rules'].forEach(k=>{if(k in d)S[k]=d[k]});const ms=[...new Set(S.txns.map(x=>'txn_'+x.date.slice(0,7)))];Store.mark('settings','money','tasks','habits','carpool',...ms);applyTheme();render();toast('Backup restored')})}catch(err){toast('That file isn’t a Mine backup')}};r.readAsText(t.files[0])}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  const t=e.target;
  if(t.id==='quick'){e.preventDefault();addQuick(t.value,t.dataset.date)}
  else if(t.id==='x-split-new'){e.preventDefault();$('[data-act="x-split-add"]').click()}
  else if(t.id==='t-newsub'){e.preventDefault();$('[data-act="add-sub"]').click()}
  else if(t.id==='cat-new-exp'||t.id==='cat-new-inc'){e.preventDefault();$(`[data-act="cat-add"][data-k="${t.id.slice(-3)}"]`).click()}
});
window.addEventListener('hashchange',()=>{if(route()==='tasks')UI.sel='all';render();window.scrollTo(0,0)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkAlarms();if(['today','habits'].includes(route()))render()}});

/* ================= init ================= */
Store.loadLocal(); applyTheme(); smsTimeBackfill(); render(); syncNative();
let lastDay=todayS();
setInterval(()=>{checkAlarms();if(todayS()!==lastDay){lastDay=todayS();syncNative();if(!$('#modal').classList.contains('open'))render()}},15000);
setTimeout(checkAlarms,1500);
setInterval(syncNative,30*60000);
connect();
</script>
</body></html>
